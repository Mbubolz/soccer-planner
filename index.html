<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Session Planner & Club Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      body { background:#fff !important; color:#0f172a !important; }
      .print\:hidden { display:none !important; }
      .print\:shadow-none { box-shadow:none !important; }
      .print\:border-none { border:none !important; }
      .print\:bg-slate-800 { background:#1e293b !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .print\:bg-red-900 { background:#7f1d1d !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const STORAGE = 'pro_soccer_planner_v19';
    const ACTIVITY_FIELDS = ['title','duration','sets','explanation','coachingPoints','progression','canvas'];
    const TAGS = ['Third-man runs','Pressing triggers','Width & Depth','Counter-pressing','Compact defensive block','Quick ball circulation','Vertical penetration'];
    const CATEGORIES = ['Rondo & Technical','Build-up & Possession','Pressing & Defense','Attacking & Finishing','Conditioned Games'];
    const DEFAULT_ROSTER = [
      ['Goalkeeper 1','1','GK'],['Fullback 1','2','RB'],['Center Back 1','4','CB'],['Center Back 2','5','CB'],['Fullback 2','3','LB'],
      ['Defensive Mid','6','CDM'],['Central Mid 1','8','CM'],['Attacking Mid','10','CAM'],['Winger 1','7','RW'],['Center Forward','9','ST'],['Winger 2','11','LW']
    ].map(([name,number,position], id) => ({ id:id+1, name, number, position, status:'Available', kpiNotes:'' }));
    const DEFAULT_MICRO = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((day, i) => ({
      day, focus:['Recovery / Tactical Video Review','Strength / Build-up Phase Mechanics','Endurance / Positional Rondo & Waves','Tactical Integration / Pressing Triggers','Match Prep / Sharpness & Set Pieces','MATCH DAY (COMPETITION)','Complete Rest / Regeneration'][i],
      load:['Low','High','High','Moderate','Low','Max','None'][i]
    }));
    const DEFAULT_SESSION = {
      clubName:'ACADEMY & CLUB DEVELOPMENT SUITE', manageOneself:'', manageSpace:'', manageTheBall:'', team:'', date:'', sessionTime:'', totalSpace:'', load:'Moderate', sessionDuration:'90m',
      activities:[
        { title:'Activity 1: Technical Activation / Rondo', duration:'', sets:'', explanation:'', coachingPoints:'', progression:'', canvas:{frames:[[]]} },
        { title:'Activity 2: Positional Play & Build-up', duration:'', sets:'', explanation:'', coachingPoints:'', progression:'', canvas:{frames:[[]]} },
        { title:'Activity 3: Tactical Phase / Overloads', duration:'', sets:'', explanation:'', coachingPoints:'', progression:'', canvas:{frames:[[]]} },
        { title:'Activity 4: Conditioned Match / 11v11', duration:'', sets:'', explanation:'', coachingPoints:'', progression:'', canvas:{frames:[[]]} }
      ]
    };
    const PRESETS = [
      {id:'preset_1',title:'4v2 Positional Rondo',category:CATEGORIES[0],explanation:'4 attackers retain possession against 2 defenders inside a 15x15 grid. Focus on sharp 2-touch combinations and body shape.',coachingPoints:'• Open body shape to see next pass\n• Speed of ball circulation (1-2 touch max)\n• Create passing angles supporting player',canvas:{frames:[[]]},isPreset:true},
      {id:'preset_2',title:'Build-up Through the 6',category:CATEGORIES[1],explanation:'Center-backs and goalkeeper circulate with the defensive midfielder against 3 pressing forwards to break into midfield.',coachingPoints:'• Invite pressure before releasing ball\n• Recognize third-man runs\n• Body orientation of the #6',canvas:{frames:[[]]},isPreset:true},
      {id:'preset_3',title:'High Pressing 3v3 + 2 Waves',category:CATEGORIES[2],explanation:'Red team initiates a high press to win the ball within 6 seconds. Neutral players become outlets after regaining possession.',coachingPoints:'• Immediate counter-press upon loss\n• Cover shadows cut passing lanes\n• Curved runs force play wide',canvas:{frames:[[]]},isPreset:true},
      {id:'preset_4',title:'Final Third Overloads & Crossing',category:CATEGORIES[3],explanation:'Wide winger combines with full-back and #10 to create a 3v2 overload, leading to driven crosses and box runs.',coachingPoints:'• Time runs into the box\n• Far-post / near-post split\n• Quality and pace of delivery',canvas:{frames:[[]]},isPreset:true}
    ];
    const DEFAULT_LINEUP = { formation:'4-3-3', gk:'1', rb:'2', cb1:'4', cb2:'5', lb:'3', cdm:'6', cm1:'8', cm2:'10', rw:'7', st:'9', lw:'11', notes:'' };

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function loadStore() { try { return JSON.parse(localStorage.getItem(STORAGE)) || {}; } catch { return {}; } }
    function usePersistentState(key, fallback, store, setStore) {
      const [value, setValue] = useState(() => store[key] ?? clone(fallback));
      useEffect(() => setStore(prev => ({...prev, [key]:value})), [key,value,setStore]);
      return [value,setValue];
    }
    function Button({children, onClick, active=false, tone='slate', className=''}) {
      const colors = active ? `bg-${tone}-600 text-white` : 'bg-slate-100 text-slate-700 hover:bg-slate-200';
      return <button type="button" onClick={onClick} className={`px-3 py-2 rounded-lg text-xs font-bold transition ${colors} ${className}`}>{children}</button>;
    }
    function Modal({title,onClose,children}) { return <div className="fixed inset-0 z-50 bg-slate-950/75 flex items-center justify-center p-4"><div className="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl"><div className="flex justify-between items-center border-b pb-3 mb-4"><h2 className="font-black text-slate-900">{title}</h2><button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-200 font-bold">×</button></div>{children}</div></div>; }

    function TacticalCanvas({value,onChange,fullscreen=false}) {
      const canvasRef=useRef(null); const [tool,setTool]=useState('select'); const [frame,setFrame]=useState(0); const [drag,setDrag]=useState(null); const [start,setStart]=useState(null); const [playing,setPlaying]=useState(false); const [mode,setMode]=useState('full'); const [grid,setGrid]=useState(false); const frames=value?.frames?.length ? value.frames : [[]]; const elements=frames[frame]||[];
      const updateFrames = updater => onChange({...value,frames: typeof updater==='function' ? updater(frames) : updater});
      const point=e=>{const r=canvasRef.current.getBoundingClientRect();return {x:(e.clientX-r.left)*560/r.width,y:(e.clientY-r.top)*320/r.height};};
      useEffect(()=>{const c=canvasRef.current;if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,560,320);x.fillStyle='#166534';x.fillRect(0,0,560,320);x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(15,15,530,290);if(mode==='full'){x.beginPath();x.moveTo(15,160);x.lineTo(545,160);x.stroke();x.beginPath();x.arc(280,160,45,0,Math.PI*2);x.stroke();}else if(mode==='half'){x.strokeRect(190,15,180,65);x.strokeRect(235,15,90,25);}else{x.strokeRect(180,15,200,80);}if(grid){x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=.5;for(let i=0;i<560;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i,320);x.stroke();}for(let i=0;i<320;i+=30){x.beginPath();x.moveTo(0,i);x.lineTo(560,i);x.stroke();}}elements.forEach((el,i)=>draw(x,el,drag?.index===i));},[value,frame,drag,mode,grid,start]);
      useEffect(()=>{if(!playing||frames.length<2)return;const id=setInterval(()=>setFrame(f=>(f+1)%frames.length),800);return()=>clearInterval(id)},[playing,frames.length]);
      const draw=(x,el,selected)=>{x.save();x.strokeStyle=selected?'#facc15':'#fff';x.fillStyle=el.type==='red'?'#dc2626':el.type==='blue'?'#2563eb':el.type==='cone'?'#eab308':'#fff';x.lineWidth=selected?4:2;if(['red','blue'].includes(el.type)){x.beginPath();x.arc(el.x,el.y,16,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#fff';x.font='bold 13px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(el.label||'',el.x,el.y);}else if(el.type==='cone'){x.beginPath();x.moveTo(el.x,el.y-12);x.lineTo(el.x-10,el.y+10);x.lineTo(el.x+10,el.y+10);x.closePath();x.fill();x.stroke();}else if(el.type==='goal'){x.strokeRect(el.x-25,el.y-8,50,16);}else if(el.type==='freehand'){x.beginPath();el.points.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();}else{x.setLineDash(el.type==='dribble'?[6,6]:el.type==='move'?[4,4]:[]);x.beginPath();x.moveTo(el.sx,el.sy);x.lineTo(el.ex,el.ey);x.stroke();x.setLineDash([]);const a=Math.atan2(el.ey-el.sy,el.ex-el.sx);x.fillStyle=x.strokeStyle;x.beginPath();x.moveTo(el.ex,el.ey);x.lineTo(el.ex-12*Math.cos(a-.5),el.ey-12*Math.sin(a-.5));x.lineTo(el.ex-12*Math.cos(a+.5),el.ey-12*Math.sin(a+.5));x.fill();}x.restore();};
      const add=el=>updateFrames(fs=>fs.map((f,i)=>i===frame?[...f,el]:f));
      const down=e=>{if(playing)return;const p=point(e);if(['pass','dribble','move'].includes(tool)){if(!start)setStart(p);else{add({type:tool,sx:start.x,sy:start.y,ex:p.x,ey:p.y});setStart(null)}return;}if(tool==='erase'){updateFrames(fs=>fs.map((f,i)=>i===frame?f.filter(el=>el.x===undefined||Math.hypot(el.x-p.x,el.y-p.y)>24):f));return;}for(let i=elements.length-1;i>=0;i--){const el=elements[i];if(el.x!==undefined&&Math.hypot(el.x-p.x,el.y-p.y)<22){setDrag({index:i,offsetX:p.x-el.x,offsetY:p.y-el.y});return;}}if(tool==='select')return;if(tool==='freehand'){add({type:'freehand',points:[p]});setDrag({index:elements.length,type:'freehand'});return;}add({type:tool,x:p.x,y:p.y,label:'9'});setDrag({index:elements.length});};
      const move=e=>{if(!drag)return;const p=point(e);updateFrames(fs=>fs.map((f,i)=>{if(i!==frame)return f;const out=f.map(x=>({...x}));const el=out[drag.index];if(!el)return f;if(drag.type==='freehand')el.points=[...el.points,p];else if(el.x!==undefined){el.x=p.x-(drag.offsetX||0);el.y=p.y-(drag.offsetY||0);}return out;}));};
      const tools=[['select','Select'],['pass','Pass'],['dribble','Dribble'],['move','Run'],['freehand','Sketch'],['red','Red'],['blue','Blue'],['cone','Cone'],['goal','Goal'],['erase','Erase']];
      return <div className="bg-slate-900 rounded-xl p-3 text-white"><div className="flex flex-wrap gap-1.5 mb-2 print:hidden">{tools.map(([id,label])=><Button key={id} onClick={()=>{setTool(id);setStart(null)}} active={tool===id} tone={id==='red'?'red':id==='blue'?'blue':id==='dribble'?'amber':'emerald'}>{label}</Button>)}<Button onClick={()=>setGrid(!grid)} active={grid} tone="blue">Grid</Button><Button onClick={()=>setMode('full')} active={mode==='full'} tone="emerald">Full</Button><Button onClick={()=>setMode('half')} active={mode==='half'} tone="emerald">Half</Button><Button onClick={()=>setMode('third')} active={mode==='third'} tone="emerald">Third</Button><Button onClick={()=>setPlaying(!playing)} active={playing} tone="amber">{playing?'Pause':'Play'}</Button><Button onClick={()=>updateFrames([[]])} tone="red">Clear</Button></div><div className="flex gap-1 mb-2 print:hidden">{frames.map((_,i)=><button key={i} onClick={()=>{setFrame(i);setPlaying(false)}} className={`w-7 h-7 rounded font-bold text-xs ${frame===i?'bg-blue-600':'bg-slate-700'}`}>{i+1}</button>)}<button onClick={()=>{updateFrames([...frames,clone(elements)]);setFrame(frames.length)}} className="px-2 rounded bg-slate-700 text-xs font-bold">＋ Keyframe</button>{frames.length>1&&<button onClick={()=>{updateFrames(frames.filter((_,i)=>i!==frame));setFrame(Math.max(0,frame-1))}} className="px-2 rounded bg-red-900 text-xs">×</button>}</div>{start&&<div className="text-center text-xs bg-indigo-900 rounded p-1 mb-2">Click a destination to complete the arrow.</div>}<canvas ref={canvasRef} width="560" height="320" onMouseDown={down} onMouseMove={move} onMouseUp={()=>setDrag(null)} onMouseLeave={()=>setDrag(null)} className="w-full max-w-[560px] h-[320px] mx-auto rounded-lg border-2 border-slate-700 touch-none cursor-crosshair" /></div>;
    }

    function SessionSheet({session,setSession,notify}) { const update=(key,value)=>setSession(s=>({...s,[key]:value})); const updateActivity=(i,key,value)=>setSession(s=>({...s,activities:s.activities.map((a,n)=>n===i?{...a,[key]:value}:a)})); const [fullscreen,setFullscreen]=useState(null); const copy=(from,to)=>setSession(s=>({...s,activities:s.activities.map((a,i)=>i===to?{...clone(s.activities[from]),title:s.activities[from].title+' (Copy)'}:a)})); return <><div className="flex justify-between items-center mb-4 print:hidden"><p className="text-xs text-slate-600">Build a professional session plan, then print or download it.</p><button onClick={()=>{const name=prompt('Name this session:',session.team||'Training Session');if(name){notify('Session saved to library');window.dispatchEvent(new CustomEvent('save-session',{detail:{name,data:clone(session)}}));}}} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold">💾 Save Session to Library</button></div><div id="session-sheet-container" className="bg-white border-2 border-slate-900 rounded-xl shadow-2xl p-6 sm:p-10 print:shadow-none"><div className="border-b-2 border-slate-900 pb-4 mb-6 flex justify-between gap-4"><div><input value={session.clubName} onChange={e=>update('clubName',e.target.value)} className="font-black text-xs uppercase tracking-widest text-emerald-700 w-full"/><h2 className="text-2xl font-black uppercase">Tactical Training Session Plan</h2></div><div className="text-right text-xs"><span className="block text-[10px] uppercase font-bold text-slate-400">Head Coach / Technical Director</span><b>Professional Curriculum Framework</b></div></div><div className="grid sm:grid-cols-3 bg-red-900 text-white rounded-lg overflow-hidden mb-6">{[['manageOneself','Manage Oneself'],['manageSpace','Manage Space'],['manageTheBall','Manage The Ball']].map(([key,label])=><label key={key} className="p-3 text-center text-[10px] font-black uppercase tracking-widest border-b sm:border-b-0 sm:border-r border-red-800">{label}<input value={session[key]} onChange={e=>update(key,e.target.value)} placeholder="Enter principles..." className="mt-1 w-full bg-red-950/70 rounded p-1.5 text-center text-xs normal-case"/></label>)}</div><div className="grid grid-cols-2 sm:grid-cols-6 gap-2.5 mb-8 text-xs">{[['team','Team'],['date','Date'],['sessionTime','Time'],['totalSpace','Space'],['load','Load'],['sessionDuration','Duration']].map(([key,label])=><label key={key} className="border p-2.5 rounded-lg bg-slate-50 font-extrabold text-[9px] uppercase text-slate-400">{label}{key==='load'?<select value={session[key]} onChange={e=>update(key,e.target.value)} className="block w-full text-xs text-slate-900 bg-transparent">{['Low','Moderate','High','Max'].map(x=><option key={x}>{x}</option>)}</select>:<input type={key==='date'?'date':'text'} value={session[key]} onChange={e=>update(key,e.target.value)} className="block w-full text-xs text-slate-900 bg-transparent"/>}</label>)}</div><div className="space-y-6">{session.activities.map((a,i)=><section key={i} className="border-2 border-slate-800 rounded-xl overflow-hidden"><div className="bg-slate-900 print:bg-slate-800 text-white p-3 flex flex-wrap items-center gap-2"><input value={a.title} onChange={e=>updateActivity(i,'title',e.target.value)} className="bg-transparent font-bold flex-1 min-w-[220px]"/><span className="text-xs">Dur <input value={a.duration} onChange={e=>updateActivity(i,'duration',e.target.value)} className="bg-slate-700 w-14 px-1"/></span><span className="text-xs">Sets <input value={a.sets} onChange={e=>updateActivity(i,'sets',e.target.value)} className="bg-slate-700 w-16 px-1"/></span><select defaultValue="" onChange={e=>{if(e.target.value)copy(Number(e.target.value),i)}} className="bg-slate-700 text-xs p-1 print:hidden"><option value="">Copy from…</option>{session.activities.map((_,n)=>n!==i&&<option key={n} value={n}>{n+1}</option>)}</select></div><div className="p-4 grid lg:grid-cols-2 gap-5 bg-slate-50/70"><div className="space-y-3"><label className="block text-xs font-bold">Organization / Explanation<textarea value={a.explanation} onChange={e=>updateActivity(i,'explanation',e.target.value)} className="w-full h-24 border rounded-lg p-3 bg-white"/></label><label className="block text-xs font-bold">Coaching Points<textarea value={a.coachingPoints} onChange={e=>updateActivity(i,'coachingPoints',e.target.value)} className="w-full h-24 border rounded-lg p-3 bg-white"/></label><div className="flex flex-wrap gap-1 print:hidden">{TAGS.slice(0,4).map(tag=><button key={tag} onClick={()=>updateActivity(i,'coachingPoints',(a.coachingPoints? a.coachingPoints+'\n':'')+'• '+tag)} className="bg-slate-200 px-2 py-1 rounded text-[10px]">{tag}</button>)}</div><label className="block text-xs font-bold">Progression<input value={a.progression} onChange={e=>updateActivity(i,'progression',e.target.value)} className="w-full border rounded-lg p-2 bg-white"/></label></div><div><TacticalCanvas value={a.canvas} onChange={v=>updateActivity(i,'canvas',v)}/><button onClick={()=>setFullscreen(i)} className="mt-2 bg-indigo-700 text-white px-3 py-2 rounded-lg text-xs font-bold print:hidden">⛶ Fullscreen Editor</button></div></div></section>)}</div></div>{fullscreen!==null&&<Modal title={`Animated Pitch Editor — Activity ${fullscreen+1}`} onClose={()=>setFullscreen(null)}><TacticalCanvas value={session.activities[fullscreen].canvas} onChange={v=>updateActivity(fullscreen,'canvas',v)}/></Modal>}</> }

    function App(){ const initial=loadStore(); const [store,setStore]=useState(initial); const [view,setView]=useState('session'); const [toast,setToast]=useState(''); const [session,setSession]=usePersistentState('session',DEFAULT_SESSION,store,setStore); const [micro,setMicro]=usePersistentState('microcycle',DEFAULT_MICRO,store,setStore); const [roster,setRoster]=usePersistentState('roster',DEFAULT_ROSTER,store,setStore); const [lineup,setLineup]=usePersistentState('lineup',DEFAULT_LINEUP,store,setStore); const [drills,setDrills]=usePersistentState('drills',PRESETS,store,setStore); const [library,setLibrary]=usePersistentState('library',[],store,setStore); const [query,setQuery]=useState(''); const [category,setCategory]=useState('All');
      useEffect(()=>localStorage.setItem(STORAGE,JSON.stringify(store)),[store]); useEffect(()=>{const f=e=>setLibrary(x=>[...x,e.detail]);window.addEventListener('save-session',f);return()=>window.removeEventListener('save-session',f)},[]); const notify=m=>{setToast(m);setTimeout(()=>setToast(''),2500)}; const print=()=>window.print(); const pdf=()=>{const el=document.getElementById('session-sheet-container');if(window.html2pdf)html2pdf().from(el).set({margin:.5,filename:`${session.team||'Training'}_Session_Plan.pdf`,html2canvas:{scale:2},jsPDF:{unit:'in',format:'letter'}}).save()}; const nav=[['session','Session'],['micro','Micro-cycle'],['roster',`Roster (${roster.length})`],['lineup','Lineup'],['drills',`Drill Bank (${drills.length})`],['library',`Library (${library.length})`]];
      const filtered=drills.filter(d=>(category==='All'||d.category===category)&&(`${d.title} ${d.explanation}`.toLowerCase().includes(query.toLowerCase())));
      const loadDrill=(d,i)=>{setSession(s=>({...s,activities:s.activities.map((a,n)=>n===i?{...a,title:d.title,explanation:d.explanation,coachingPoints:d.coachingPoints,canvas:clone(d.canvas)}:a)}));setView('session');notify(`Loaded drill into Activity ${i+1}`)};
      return <main className="max-w-6xl mx-auto p-4 sm:p-6"><header className="bg-white rounded-xl shadow-md border p-5 mb-6 flex flex-wrap justify-between gap-4 items-center"><div><h1 className="font-black tracking-wider uppercase text-lg"><span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-600 mr-2"/>Pro Session Planner & Club Suite</h1><p className="text-xs text-slate-500">Periodized session sheets, animated diagrams, squad roster, and starting XI lineup.</p></div><div className="flex flex-wrap gap-1.5">{nav.map(([id,label])=><Button key={id} onClick={()=>setView(id)} active={view===id} tone="emerald">{label}</Button>)}<Button onClick={pdf} tone="emerald">📥 PDF</Button><Button onClick={print}>🖨️ Print</Button></div></header>{toast&&<div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white border border-emerald-500 px-4 py-3 rounded-xl text-xs font-bold">✔ {toast}</div>}
        {view==='session'&&<SessionSheet session={session} setSession={setSession} notify={notify}/>} 
        {view==='micro'&&<Panel title="7-Day Tactical & Physical Microcycle"><div className="space-y-3">{micro.map((d,i)=><div key={d.day} className="grid sm:grid-cols-[8rem_1fr_10rem] gap-2 items-center bg-slate-50 border rounded-xl p-3"><b>{d.day}</b><input value={d.focus} onChange={e=>setMicro(x=>x.map((v,n)=>n===i?{...v,focus:e.target.value}:v))} className="border rounded-lg p-2"/><select value={d.load} onChange={e=>setMicro(x=>x.map((v,n)=>n===i?{...v,load:e.target.value}:v))} className="border rounded-lg p-2">{['None','Low','Moderate','High','Max'].map(x=><option key={x}>{x}</option>)}</select></div>)}</div></Panel>}
        {view==='roster'&&<Panel title="Squad Roster & Player KPIs"><button onClick={()=>{const name=prompt('Player name');if(name)setRoster(x=>[...x,{id:Date.now(),name,number:'',position:'UTL',status:'Available',kpiNotes:''}])}} className="mb-4 bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold">＋ Add Player</button><div className="space-y-3">{roster.map(p=><div key={p.id} className="grid md:grid-cols-[1fr_5rem_6rem_10rem_1fr_auto] gap-2 items-center border rounded-xl p-3 bg-slate-50"><input value={p.name} onChange={e=>setRoster(x=>x.map(v=>v.id===p.id?{...v,name:e.target.value}:v))} className="font-bold bg-transparent"/><input value={p.number} onChange={e=>setRoster(x=>x.map(v=>v.id===p.id?{...v,number:e.target.value}:v))} className="border rounded p-2"/><input value={p.position} onChange={e=>setRoster(x=>x.map(v=>v.id===p.id?{...v,position:e.target.value}:v))} className="border rounded p-2"/><select value={p.status} onChange={e=>setRoster(x=>x.map(v=>v.id===p.id?{...v,status:e.target.value}:v))} className="border rounded p-2"><option>Available</option><option>Limited</option><option>Injured</option></select><input value={p.kpiNotes} placeholder="Performance KPI / notes" onChange={e=>setRoster(x=>x.map(v=>v.id===p.id?{...v,kpiNotes:e.target.value}:v))} className="border rounded p-2"/><button onClick={()=>setRoster(x=>x.filter(v=>v.id!==p.id))} className="text-red-600 text-xs font-bold">Delete</button></div>)}</div></Panel>}
        {view==='lineup'&&<Panel title="Match Day Starting XI & Lineup"><div className="grid sm:grid-cols-2 gap-3">{[['formation','Formation'],...['gk','rb','cb1','cb2','lb','cdm','cm1','cm2','rw','st','lw'].map(x=>[x,x.toUpperCase()])].map(([key,label])=><label key={key} className="text-xs font-bold text-slate-600">{label}<select value={lineup[key]} onChange={e=>setLineup(x=>({...x,[key]:e.target.value}))} className="block w-full border rounded-lg p-2 bg-white mt-1">{key==='formation'?['4-3-3','4-4-2','3-5-2'].map(x=><option key={x}>{x}</option>):<><option value="">Select player…</option>{roster.map(p=><option key={p.id} value={p.number}>{p.number}. {p.name} ({p.position})</option>)}</>}</select></label>)}</div><label className="block mt-4 text-xs font-bold">Matchday Tactical Instructions<textarea value={lineup.notes} onChange={e=>setLineup(x=>({...x,notes:e.target.value}))} className="w-full h-32 border rounded-lg p-3 mt-1"/></label></Panel>}
        {view==='drills'&&<Panel title="Drill Bank & Club Library"><div className="flex flex-wrap gap-2 mb-5"><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search drills…" className="border rounded-lg p-2 text-sm flex-1 min-w-[220px]"/><select value={category} onChange={e=>setCategory(e.target.value)} className="border rounded-lg p-2 text-sm"><option>All</option>{CATEGORIES.map(x=><option key={x}>{x}</option>)}</select><button onClick={()=>{const title=prompt('Drill title');if(title)setDrills(x=>[...x,{id:Date.now(),title,category:CATEGORIES[0],explanation:'',coachingPoints:'',canvas:{frames:[[]]}}])}} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold">＋ Add Drill</button></div><div className="grid md:grid-cols-2 gap-4">{filtered.map(d=><article key={d.id} className="border rounded-xl p-4 bg-slate-50"><span className="text-[10px] uppercase font-black text-emerald-700">{d.category}</span><h3 className="font-black text-lg mt-1">{d.title}</h3><p className="text-xs text-slate-600 whitespace-pre-wrap mt-2">{d.explanation||'No description provided.'}</p><p className="text-xs whitespace-pre-wrap mt-2"><b>Coaching:</b> {d.coachingPoints||'—'}</p><div className="flex gap-2 mt-4 flex-wrap">{[0,1,2,3].map(i=><button key={i} onClick={()=>loadDrill(d,i)} className="bg-slate-900 text-white px-2 py-1 rounded text-xs">Load Act {i+1}</button>)}{!d.isPreset&&<button onClick={()=>setDrills(x=>x.filter(v=>v.id!==d.id))} className="text-red-600 text-xs font-bold">Delete</button>}</div></article>)}</div></Panel>}
        {view==='library'&&<Panel title="Saved Session Library">{library.length===0?<p className="text-sm text-slate-500 italic">No saved sessions yet. Save a session from the Session view.</p>:<div className="grid md:grid-cols-2 gap-4">{library.map((item,i)=><article key={i} onClick={()=>{setSession(clone(item.data));setView('session');notify(`Loaded ${item.name}`)}} className="border rounded-xl p-4 bg-slate-50 cursor-pointer hover:bg-emerald-50"><div className="flex justify-between"><h3 className="font-black">{item.name}</h3><button onClick={e=>{e.stopPropagation();setLibrary(x=>x.filter((_,n)=>n!==i))}} className="text-red-600 text-xs font-bold">Delete</button></div><p className="text-xs text-slate-500">{item.data.team||'Team not specified'} · {item.data.date||'Date not specified'}</p><p className="text-xs text-emerald-700 font-bold mt-3">Click to reopen session →</p></article>)}</div>}</Panel>}
      </main>;
    }
    function Panel({title,children}){return <section className="bg-white border-2 border-slate-900 rounded-xl shadow-xl p-6 sm:p-8"><h2 className="text-xl font-black uppercase mb-1">{title}</h2><p className="text-xs text-slate-500 mb-6">Keep your coaching workflow organized and ready for the pitch.</p>{children}</section>}
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
