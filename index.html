<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Session Planner & Club Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2pdf for robust client-side PDF downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            body { 
                background: white !important; 
                color: #0f172a !important; 
                font-family: ui-sans-serif, system-ui, -apple-system, sans-serif !important;
            }
            .print\:hidden { display: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:border-none { border: none !important; }
            .print\:p-0 { padding: 0 !important; }
            .print\:border-slate-300 { border-color: #cbd5e1 !important; }
            .print\:bg-slate-50 { background-color: #f8fafc !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print\:bg-red-900 { background-color: #7f1d1d !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print\:bg-slate-800 { background-color: #1e293b !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function TacticalSketchpad({ initialData, onSave, onFullscreen, isPrinting }) {
            const canvasRef = React.useRef(null);
            const [tool, setTool] = React.useState('select'); 
            
            const [frames, setFrames] = React.useState(
                initialData && initialData.frames ? initialData.frames : [initialData || []]
            );
            const [currentFrameIdx, setCurrentFrameIdx] = React.useState(0);
            const [isPlaying, setIsPlaying] = React.useState(false);

            // Two-click state for pass/dribble arrow creation
            const [arrowStart, setArrowStart] = React.useState(null);

            const elements = frames[currentFrameIdx] || [];

            const setElements = (newElementsOrUpdater) => {
                const updatedFrames = [...frames];
                const currentElements = updatedFrames[currentFrameIdx];
                const nextElements = typeof newElementsOrUpdater === 'function' 
                    ? newElementsOrUpdater(currentElements) 
                    : newElementsOrUpdater;
                
                updatedFrames[currentFrameIdx] = nextElements;
                setFrames(updatedFrames);
            };

            const [dragState, setDragState] = React.useState(null); 
            const [fieldMode, setFieldMode] = React.useState('full'); 
            const [snapGrid, setSnapGrid] = React.useState(false);
            const [playerNumberInput, setPlayerNumberInput] = React.useState('9');

            const GRID_SIZE = 30;

            React.useEffect(() => {
                let interval;
                if (isPlaying && frames.length > 1) {
                    interval = setInterval(() => {
                        setCurrentFrameIdx(prev => (prev + 1) % frames.length);
                    }, 800);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [isPlaying, frames.length]);

            React.useEffect(() => {
                redrawCanvas();
                onSave({ frames });
            }, [frames, currentFrameIdx, dragState, fieldMode, snapGrid, arrowStart]);

            const snap = (val) => {
                if (!snapGrid) return val;
                return Math.round(val / GRID_SIZE) * GRID_SIZE;
            };

            const redrawCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#166534';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;

                if (fieldMode === 'full') {
                    ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);
                    ctx.beginPath();
                    ctx.moveTo(15, canvas.height / 2);
                    ctx.lineTo(canvas.width - 15, canvas.height / 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, canvas.height / 2, 45, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, canvas.height / 2, 3, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.strokeRect(canvas.width / 2 - 70, 15, 140, 35);
                    ctx.strokeRect(canvas.width / 2 - 70, canvas.height - 50, 140, 35);
                } else if (fieldMode === 'half') {
                    ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);
                    ctx.strokeRect(canvas.width / 2 - 90, 15, 180, 65);
                    ctx.strokeRect(canvas.width / 2 - 45, 15, 90, 25);
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, 80, 45, 0, Math.PI);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, 15, 3, 0, 2 * Math.PI);
                    ctx.fill();
                } else if (fieldMode === 'third') {
                    ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);
                    ctx.strokeRect(canvas.width / 2 - 100, 15, 200, 80);
                    ctx.strokeRect(canvas.width / 2 - 45, 15, 90, 25);
                }

                if (snapGrid && !isPrinting) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                    ctx.lineWidth = 0.5;
                    for (let x = 0; x < canvas.width; x += GRID_SIZE) {
                        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                    }
                    for (let y = 0; y < canvas.height; y += GRID_SIZE) {
                        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                    }
                }

                elements.forEach((el, idx) => {
                    drawElement(ctx, el, !isPlaying && !isPrinting && dragState && dragState.index === idx);
                });

                // Draw preview of second click for pass / dribble / movement
                if (arrowStart && (tool === 'pass' || tool === 'dribble' || tool === 'player_move' || tool === 'ball_move')) {
                    ctx.save();
                    ctx.strokeStyle = tool === 'dribble' ? '#facc15' : tool === 'ball_move' ? '#f8fafc' : '#38bdf8';
                    ctx.lineWidth = 3;
                    if (tool === 'dribble') ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.moveTo(arrowStart.x, arrowStart.y);
                    ctx.lineTo(arrowStart.currentX || arrowStart.x, arrowStart.currentY || arrowStart.y);
                    ctx.stroke();
                    ctx.restore();
                }
            };

            const drawElement = (ctx, el, isSelected) => {
                ctx.save();
                if (el.type === 'red_player' || el.type === 'blue_player') {
                    ctx.fillStyle = el.type === 'red_player' ? '#dc2626' : '#2563eb';
                    ctx.strokeStyle = isSelected ? '#facc15' : '#ffffff';
                    ctx.lineWidth = isSelected ? 4 : 2;
                    ctx.beginPath();
                    ctx.arc(el.x, el.y, 16, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.stroke();

                    if (el.label) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 13px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(el.label, el.x, el.y);
                    }
                } else if (el.type === 'cone') {
                    ctx.fillStyle = '#eab308';
                    ctx.strokeStyle = isSelected ? '#ffffff' : '#a16207';
                    ctx.lineWidth = isSelected ? 3 : 1;
                    ctx.beginPath();
                    ctx.moveTo(el.x, el.y - 12);
                    ctx.lineTo(el.x - 10, el.y + 10);
                    ctx.lineTo(el.x + 10, el.y + 10);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (el.type === 'pole') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(el.x - 3, el.y - 16, 6, 32);
                    ctx.fillStyle = '#dc2626';
                    ctx.fillRect(el.x - 3, el.y - 16, 6, 12);
                    if (isSelected) {
                        ctx.strokeStyle = '#facc15';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(el.x - 7, el.y - 18, 14, 36);
                    }
                } else if (el.type === 'goal') {
                    ctx.strokeStyle = isSelected ? '#facc15' : '#f8fafc';
                    ctx.lineWidth = isSelected ? 4 : 3;
                    ctx.save();
                    ctx.translate(el.x, el.y);
                    if (el.rotation) ctx.rotate(el.rotation);
                    ctx.strokeRect(-25, -8, 50, 16);
                    ctx.restore();
                } else if (el.type === 'pass' || el.type === 'dribble' || el.type === 'player_move' || el.type === 'ball_move') {
                    ctx.strokeStyle = el.type === 'pass' ? '#ffffff' : el.type === 'dribble' ? '#facc15' : el.type === 'ball_move' ? '#f8fafc' : '#38bdf8';
                    ctx.lineWidth = isSelected ? 4 : 3;
                    if (el.type === 'dribble') ctx.setLineDash([6, 6]);
                    if (el.type === 'player_move' || el.type === 'ball_move') ctx.setLineDash([4, 4]);
                    
                    ctx.beginPath();
                    ctx.moveTo(el.startX, el.startY);
                    ctx.lineTo(el.endX, el.endY);
                    ctx.stroke();

                    const angle = Math.atan2(el.endY - el.startY, el.endX - el.startX);
                    ctx.setLineDash([]);
                    ctx.fillStyle = ctx.strokeStyle;
                    ctx.beginPath();
                    ctx.moveTo(el.endX, el.endY);
                    ctx.lineTo(el.endX - 12 * Math.cos(angle - Math.PI / 6), el.endY - 12 * Math.sin(angle - Math.PI / 6));
                    ctx.lineTo(el.endX - 12 * Math.cos(angle + Math.PI / 6), el.endY - 12 * Math.sin(angle + Math.PI / 6));
                    ctx.lineTo(el.endX, el.endY);
                    ctx.fill();

                    if (isSelected) {
                        ctx.fillStyle = '#facc15';
                        ctx.beginPath();
                        ctx.arc(el.startX, el.startY, 6, 0, 2 * Math.PI);
                        ctx.arc(el.endX, el.endY, 6, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                } else if (el.type === 'freehand' && el.points && el.points.length > 0) {
                    ctx.strokeStyle = isSelected ? '#facc15' : '#f8fafc';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(el.points[0].x, el.points[0].y);
                    for (let p = 1; p < el.points.length; p++) {
                        ctx.lineTo(el.points[p].x, el.points[p].y);
                    }
                    ctx.stroke();
                }
                ctx.restore();
            };

            const addFormationPreset = (formationType) => {
                const cx = 280;
                const cy = 160;
                let newPlayers = [];

                if (formationType === '4-3-3') {
                    newPlayers = [
                        { type: 'blue_player', x: cx, y: cy + 110, label: '1', rotation: 0 },
                        { type: 'blue_player', x: cx - 100, y: cy + 50, label: '2', rotation: 0 },
                        { type: 'blue_player', x: cx - 35, y: cy + 60, label: '4', rotation: 0 },
                        { type: 'blue_player', x: cx + 35, y: cy + 60, label: '5', rotation: 0 },
                        { type: 'blue_player', x: cx + 100, y: cy + 50, label: '3', rotation: 0 },
                        { type: 'blue_player', x: cx, y: cy, label: '6', rotation: 0 },
                        { type: 'blue_player', x: cx - 45, y: cy - 35, label: '8', rotation: 0 },
                        { type: 'blue_player', x: cx + 45, y: cy - 35, label: '10', rotation: 0 },
                        { type: 'blue_player', x: cx - 100, y: cy - 80, label: '7', rotation: 0 },
                        { type: 'blue_player', x: cx, y: cy - 90, label: '9', rotation: 0 },
                        { type: 'blue_player', x: cx + 100, y: cy - 80, label: '11', rotation: 0 },
                    ];
                } else if (formationType === '4-4-2') {
                    newPlayers = [
                        { type: 'blue_player', x: cx, y: cy + 110, label: '1', rotation: 0 },
                        { type: 'blue_player', x: cx - 100, y: cy + 50, label: '2', rotation: 0 },
                        { type: 'blue_player', x: cx - 35, y: cy + 60, label: '4', rotation: 0 },
                        { type: 'blue_player', x: cx + 35, y: cy + 60, label: '5', rotation: 0 },
                        { type: 'blue_player', x: cx + 100, y: cy + 50, label: '3', rotation: 0 },
                        { type: 'blue_player', x: cx - 100, y: cy, label: '7', rotation: 0 },
                        { type: 'blue_player', x: cx - 35, y: cy, label: '6', rotation: 0 },
                        { type: 'blue_player', x: cx + 35, y: cy, label: '8', rotation: 0 },
                        { type: 'blue_player', x: cx + 100, y: cy, label: '11', rotation: 0 },
                        { type: 'blue_player', x: cx - 30, y: cy - 80, label: '10', rotation: 0 },
                        { type: 'blue_player', x: cx + 30, y: cy - 80, label: '9', rotation: 0 },
                    ];
                }
                setElements([...elements, ...newPlayers]);
            };

            const handleStart = (clientX, clientY) => {
                if (isPlaying || isPrinting) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = (clientX - rect.left) * scaleX;
                const y = (clientY - rect.top) * scaleY;

                if (tool === 'erase') {
                    setElements(elements.filter(el => {
                        if (el.x !== undefined) return Math.hypot(el.x - x, el.y - y) > 25;
                        if (el.points) return true;
                        return Math.hypot(el.startX - x, el.startY - y) > 25 && Math.hypot(el.endX - x, el.endY - y) > 25;
                    }));
                    return;
                }

                // Two-click tool logic for pass, dribble, player_move, ball_move
                if (tool === 'pass' || tool === 'dribble' || tool === 'player_move' || tool === 'ball_move') {
                    if (!arrowStart) {
                        setArrowStart({ x: snap(x), y: snap(y) });
                    } else {
                        const newEl = { type: tool, startX: arrowStart.x, startY: arrowStart.y, endX: snap(x), endY: snap(y) };
                        setElements([...elements, newEl]);
                        setArrowStart(null);
                    }
                    return;
                } else {
                    if (arrowStart) setArrowStart(null);
                }

                if (tool === 'freehand') {
                    const newEl = { type: 'freehand', points: [{x, y}] };
                    setElements([...elements, newEl]);
                    setDragState({ index: elements.length, type: 'freehand' });
                    return;
                }

                for (let i = elements.length - 1; i >= 0; i--) {
                    const el = elements[i];
                    if (el.x !== undefined && el.y !== undefined) {
                        if (Math.hypot(el.x - x, el.y - y) < 20) {
                            setDragState({ index: i, type: 'item', offsetX: x - el.x, offsetY: y - el.y });
                            return;
                        }
                    } else if (el.startX !== undefined) {
                        if (Math.hypot(el.startX - x, el.startY - y) < 18) {
                            setDragState({ index: i, type: 'start' });
                            return;
                        }
                        if (Math.hypot(el.endX - x, el.endY - y) < 18) {
                            setDragState({ index: i, type: 'end' });
                            return;
                        }
                    }
                }

                if (tool === 'select') {
                    setDragState(null);
                    return;
                }

                if (tool === 'red_player' || tool === 'blue_player') {
                    const newEl = { type: tool, x: snap(x), y: snap(y), label: playerNumberInput, rotation: 0 };
                    setElements([...elements, newEl]);
                    setDragState({ index: elements.length, type: 'item', offsetX: 0, offsetY: 0 });
                } else {
                    const newEl = { type: tool, x: snap(x), y: snap(y), rotation: 0 };
                    setElements([...elements, newEl]);
                    setDragState({ index: elements.length, type: 'item', offsetX: 0, offsetY: 0 });
                }
            };

            const handleMove = (clientX, clientY) => {
                if (isPlaying || isPrinting) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = (clientX - rect.left) * scaleX;
                const y = (clientY - rect.top) * scaleY;

                if (arrowStart) {
                    setArrowStart(prev => ({ ...prev, currentX: x, currentY: y }));
                }

                if (!dragState) return;

                const updated = [...elements];
                const item = { ...updated[dragState.index] };

                if (dragState.type === 'freehand') {
                    item.points = [...item.points, { x, y }];
                } else if (dragState.type === 'item') {
                    item.x = snap(x - dragState.offsetX);
                    item.y = snap(y - dragState.offsetY);
                } else if (dragState.type === 'start') {
                    item.startX = snap(x);
                    item.startY = snap(y);
                } else if (dragState.type === 'end') {
                    item.endX = snap(x);
                    item.endY = snap(y);
                }

                updated[dragState.index] = item;
                setElements(updated);
            };

            const handleMouseDown = (e) => handleStart(e.clientX, e.clientY);
            const handleMouseMove = (e) => handleMove(e.clientX, e.clientY);
            const handleMouseUp = () => setDragState(null);

            const handleTouchStart = (e) => {
                if (e.touches.length === 1) handleStart(e.touches[0].clientX, e.touches[0].clientY);
            };
            const handleTouchMove = (e) => {
                if (e.touches.length === 1) handleMove(e.touches[0].clientX, e.touches[0].clientY);
            };
            const handleTouchEnd = () => setDragState(null);

            const rotateSelectedGoal = () => {
                if (dragState === null || isPlaying || isPrinting) return;
                const updated = [...elements];
                const item = updated[dragState.index];
                if (item && item.type === 'goal') {
                    item.rotation = (item.rotation || 0) + Math.PI / 2;
                    setElements(updated);
                }
            };

            const addFrame = () => {
                const nextFrames = [...frames, JSON.parse(JSON.stringify(elements))];
                setFrames(nextFrames);
                setCurrentFrameIdx(nextFrames.length - 1);
            };

            const deleteCurrentFrame = () => {
                if (frames.length <= 1) return;
                const updated = frames.filter((_, idx) => idx !== currentFrameIdx);
                setFrames(updated);
                setCurrentFrameIdx(Math.max(0, currentFrameIdx - 1));
            };

            return (
                <div className="flex flex-col items-center bg-slate-900 print:bg-white p-3 rounded-xl text-white print:text-slate-900 w-full shadow-lg border border-slate-800 print:border-none print:shadow-none print:p-0">
                    {!isPrinting && (
                        <>
                            <div className="flex flex-wrap justify-between items-center w-full mb-2 gap-1.5 text-xs print:hidden">
                                <div className="flex gap-1.5 items-center flex-wrap">
                                    <span className="font-bold text-slate-400 uppercase tracking-wider text-[10px]">Tool:</span>
                                    <button onClick={() => setTool('select')} className={`px-2 py-1 rounded font-medium transition ${tool === 'select' ? 'bg-emerald-500 text-slate-950 font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Select</button>
                                    <button onClick={() => setTool('pass')} className={`px-2 py-1 rounded font-medium transition ${tool === 'pass' ? 'bg-white text-slate-950 font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Pass</button>
                                    <button onClick={() => setTool('dribble')} className={`px-2 py-1 rounded font-medium transition ${tool === 'dribble' ? 'bg-amber-400 text-slate-950 font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Dribble</button>
                                    <button onClick={() => setTool('player_move')} className={`px-2 py-1 rounded font-medium transition ${tool === 'player_move' ? 'bg-sky-400 text-slate-950 font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Run ➔</button>
                                    <button onClick={() => setTool('ball_move')} className={`px-2 py-1 rounded font-medium transition ${tool === 'ball_move' ? 'bg-slate-200 text-slate-950 font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Ball ➔</button>
                                    <button onClick={() => setTool('freehand')} className={`px-2 py-1 rounded font-medium transition ${tool === 'freehand' ? 'bg-cyan-500 text-slate-950 font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Sketch</button>
                                    <button onClick={() => setTool('red_player')} className={`px-2 py-1 rounded font-medium transition ${tool === 'red_player' ? 'bg-red-600 text-white font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Red</button>
                                    <button onClick={() => setTool('blue_player')} className={`px-2 py-1 rounded font-medium transition ${tool === 'blue_player' ? 'bg-blue-600 text-white font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Blue</button>
                                    <div className="flex items-center bg-slate-800 px-2 py-0.5 rounded border border-slate-700">
                                        <span className="text-[10px] text-slate-400 mr-1 font-bold">No:</span>
                                        <input type="text" value={playerNumberInput} onChange={(e) => setPlayerNumberInput(e.target.value)} className="w-6 bg-slate-900 text-center text-white rounded text-xs py-0.5 font-bold focus:outline-none" />
                                    </div>
                                    <button onClick={() => setTool('cone')} className={`px-2 py-1 rounded font-medium transition ${tool === 'cone' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Cone</button>
                                    <button onClick={() => setTool('pole')} className={`px-2 py-1 rounded font-medium transition ${tool === 'pole' ? 'bg-slate-200 text-slate-950 font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Pole</button>
                                    <button onClick={() => setTool('goal')} className={`px-2 py-1 rounded font-medium transition ${tool === 'goal' ? 'bg-slate-200 text-slate-950 font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Goal</button>
                                    <button onClick={() => setTool('erase')} className={`px-2 py-1 rounded font-medium transition ${tool === 'erase' ? 'bg-orange-600 text-white font-bold shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>Eraser</button>
                                </div>
                                <div className="flex gap-2">
                                    {onFullscreen && (
                                        <button onClick={onFullscreen} className="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded font-bold text-xs shadow transition">⛶ Fullscreen</button>
                                    )}
                                    <button onClick={() => setFrames([[]])} className="bg-red-900/80 hover:bg-red-900 text-red-200 px-2.5 py-1 rounded font-semibold text-xs transition">Clear</button>
                                </div>
                            </div>

                            {arrowStart && (
                                <div className="w-full mb-2 bg-indigo-900/90 text-indigo-200 px-3 py-1 rounded text-xs font-bold text-center border border-indigo-700 print:hidden">
                                    Click destination point on canvas to complete {tool.replace('_', ' ')} arrow.
                                </div>
                            )}

                            <div className="flex flex-wrap justify-between items-center w-full mb-2 px-3 py-1.5 bg-slate-950/60 rounded-lg text-xs gap-2 border border-slate-800 print:hidden">
                                <div className="flex gap-2 items-center flex-wrap">
                                    <span className="text-slate-400 font-bold uppercase tracking-wider text-[10px]">View:</span>
                                    <button onClick={() => setFieldMode('full')} className={`px-2 py-1 rounded transition ${fieldMode === 'full' ? 'bg-emerald-600 font-bold text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>Full</button>
                                    <button onClick={() => setFieldMode('half')} className={`px-2 py-1 rounded transition ${fieldMode === 'half' ? 'bg-emerald-600 font-bold text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>Half</button>
                                    <button onClick={() => setFieldMode('third')} className={`px-2 py-1 rounded transition ${fieldMode === 'third' ? 'bg-emerald-600 font-bold text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>Third</button>
                                    <span className="text-slate-400 font-bold uppercase tracking-wider text-[10px] ml-2">Presets:</span>
                                    <button onClick={() => addFormationPreset('4-3-3')} className="bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-1 rounded font-bold transition shadow-sm">4-3-3</button>
                                    <button onClick={() => addFormationPreset('4-4-2')} className="bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-1 rounded font-bold transition shadow-sm">4-4-2</button>
                                </div>
                                <div className="flex gap-2 items-center">
                                    <button onClick={() => setSnapGrid(!snapGrid)} className={`px-2 py-1 rounded transition ${snapGrid ? 'bg-blue-600 font-bold text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>Grid: {snapGrid ? 'On' : 'Off'}</button>
                                    <button onClick={rotateSelectedGoal} className="bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-amber-300 font-semibold transition">Rotate Goal ↻</button>
                                </div>
                            </div>

                            <div className="flex flex-wrap justify-between items-center w-full mb-2 px-3 py-1.5 bg-slate-950 rounded text-xs border border-slate-800 gap-2 print:hidden">
                                <div className="flex items-center gap-2">
                                    <span className="font-bold text-emerald-400 uppercase tracking-wider text-[10px]">Timeline:</span>
                                    <button 
                                        onClick={() => setIsPlaying(!isPlaying)} 
                                        className={`px-3 py-1 rounded font-bold transition shadow-sm ${isPlaying ? 'bg-amber-500 text-slate-950' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}`}
                                    >
                                        {isPlaying ? '⏸ Pause' : '▶ Play Sequence'}
                                    </button>
                                </div>
                                <div className="flex items-center gap-1.5 overflow-x-auto">
                                    {frames.map((_, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => { setCurrentFrameIdx(idx); setIsPlaying(false); }}
                                            className={`w-6 h-6 rounded flex items-center justify-center font-bold text-xs transition ${currentFrameIdx === idx ? 'bg-blue-600 text-white ring-2 ring-white/80' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                                        >
                                            {idx + 1}
                                        </button>
                                    ))}
                                    <button onClick={addFrame} className="bg-slate-800 hover:bg-slate-700 text-emerald-300 font-bold px-2.5 py-1 rounded text-xs ml-1 transition">＋ Keyframe</button>
                                    {frames.length > 1 && (
                                        <button onClick={deleteCurrentFrame} className="bg-red-950 hover:bg-red-900 text-red-300 px-2 py-1 rounded text-xs transition">✕</button>
                                    )}
                                </div>
                            </div>
                        </>
                    )}

                    <canvas 
                        ref={canvasRef}
                        width={560}
                        height={320}
                        onMouseDown={handleMouseDown}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseUp}
                        onTouchStart={handleTouchStart}
                        onTouchMove={handleTouchMove}
                        onTouchEnd={handleTouchEnd}
                        className="border-2 border-slate-700 print:border-slate-400 rounded-lg cursor-crosshair bg-emerald-800 shadow-inner w-full max-w-[560px] h-[320px] touch-none"
                    />
                </div>
            );
        }

        function App() {
            const [viewMode, setViewMode] = React.useState('session'); 
            const [collapsed, setCollapsed] = React.useState({ 1: false, 2: false, 3: false, 4: false });
            const [toast, setToast] = React.useState(null);
            const [fullscreenCanvas, setFullscreenCanvas] = React.useState(null); 
            const [isPrinting, setIsPrinting] = React.useState(false);
            
            // Drill Bank Drawer & Modal States
            const [selectedDrillCategory, setSelectedDrillCategory] = React.useState('All');
            const [drillSearchQuery, setDrillSearchQuery] = React.useState('');
            const [activeDrillModal, setActiveDrillModal] = React.useState(null); // Drill object being viewed/edited
            const [isSaveDrillModalOpen, setIsSaveDrillModalOpen] = React.useState(false);
            const [drillSaveTargetActivity, setDrillSaveTargetActivity] = React.useState('1');
            const [newDrillTitle, setNewDrillTitle] = React.useState('');
            const [newDrillCategory, setNewDrillCategory] = React.useState('Rondo & Technical');

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const [sessionData, setSessionData] = React.useState(() => {
                const saved = localStorage.getItem('pro_soccer_session_v15');
                return saved ? JSON.parse(saved) : {
                    clubName: 'ACADEMY & CLUB DEVELOPMENT SUITE',
                    manageOneself: '', manageSpace: '', manageTheBall: '',
                    team: '', date: '', sessionTime: '', totalSpace: '', load: 'Moderate', sessionDuration: '90m',
                    act1Title: 'Activity 1: Technical Activation / Rondo', act1Duration: '', act1SetsReps: '', act1Explanation: '', act1CoachingPoints: '', act1Progression: '', act1Canvas: {frames: [[]]},
                    act2Title: 'Activity 2: Positional Play & Build-up', act2Duration: '', act2SetsReps: '', act2Explanation: '', act2CoachingPoints: '', act2Progression: '', act2Canvas: {frames: [[]]},
                    act3Title: 'Activity 3: Tactical Phase / Overloads', act3Duration: '', act3SetsReps: '', act3Explanation: '', act3CoachingPoints: '', act3Progression: '', act3Canvas: {frames: [[]]},
                    act4Title: 'Activity 4: Conditioned Match / 11v11', act4Duration: '', act4SetsReps: '', act4Explanation: '', act4CoachingPoints: '', act4Progression: '', act4Canvas: {frames: [[]]}
                };
            });

            const [microcycle, setMicrocycle] = React.useState(() => {
                const saved = localStorage.getItem('pro_soccer_micro_v15');
                return saved ? JSON.parse(saved) : [
                    { day: 'Monday', focus: 'Recovery / Tactical Video Review', load: 'Low' },
                    { day: 'Tuesday', focus: 'Strength / Build-up Phase Mechanics', load: 'High' },
                    { day: 'Wednesday', focus: 'Endurance / Positional Rondo & Waves', load: 'High' },
                    { day: 'Thursday', focus: 'Tactical Integration / Pressing Triggers', load: 'Moderate' },
                    { day: 'Friday', focus: 'Match Prep / Sharpness & Set Pieces', load: 'Low' },
                    { day: 'Saturday', focus: 'MATCH DAY (COMPETITION)', load: 'Max' },
                    { day: 'Sunday', focus: 'Complete Rest / Regeneration', load: 'None' }
                ];
            });

            // Preloaded Preset Drills in Drill Bank
            const presetDrills = [
                {
                    id: 'preset_1',
                    title: '4v2 Positional Rondo',
                    category: 'Rondo & Technical',
                    explanation: '4 attackers retain possession against 2 defenders inside a 15x15 grid. Focus on sharp 2-touch combinations and body shape.',
                    coachingPoints: '• Open body shape to see next pass\n• Speed of ball circulation (1-2 touch max)\n• Create passing angles supporting player',
                    canvas: { frames: [[]] },
                    isPreset: true
                },
                {
                    id: 'preset_2',
                    title: 'Build-up Through the 6',
                    category: 'Build-up & Possession',
                    explanation: 'Center-backs and goalkeeper circulate with the defensive midfielder (6) against 3 pressing forwards to break into midfield zone.',
                    coachingPoints: '• Invite pressure before releasing ball\n• Recognize third-man runs into midfield\n• Body orientation of the #6 player',
                    canvas: { frames: [[]] },
                    isPreset: true
                },
                {
                    id: 'preset_3',
                    title: 'High Pressing 3v3 + 2 Waves',
                    category: 'Pressing & Defense',
                    explanation: 'Red team initiates high press to win ball within 6 seconds. Neutral players act as target outlets upon winning possession.',
                    coachingPoints: '• Immediate counter-press upon loss\n• Cover shadows cutting passing lanes\n• Curved runs by striker to force play wide',
                    canvas: { frames: [[]] },
                    isPreset: true
                },
                {
                    id: 'preset_4',
                    title: 'Final Third Overloads & Crossing',
                    category: 'Attacking & Finishing',
                    explanation: 'Wide winger combines with full-back and #10 to create 3v2 overload in wide channel, leading to driven crosses and box runs.',
                    coachingPoints: '• Timing of runs into the penalty box\n• Far post / near post split runs\n• Quality and pace of final delivery',
                    canvas: { frames: [[]] },
                    isPreset: true
                }
            ];

            const [drillBank, setDrillBank] = React.useState(() => {
                const saved = localStorage.getItem('pro_soccer_drills_v15');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Ensure presets are always present if missing
                    const existingIds = new Set(parsed.map(d => d.id));
                    const missingPresets = presetDrills.filter(p => !existingIds.has(p.id));
                    return [...missingPresets, ...parsed];
                }
                return presetDrills;
            });

            const [sessionLibrary, setSessionLibrary] = React.useState(() => {
                const saved = localStorage.getItem('pro_soccer_session_library_v15');
                return saved ? JSON.parse(saved) : [];
            });

            const [roster, setRoster] = React.useState(() => {
                const saved = localStorage.getItem('pro_soccer_roster_v15');
                return saved ? JSON.parse(saved) : [
                    { id: 1, name: 'Goalkeeper 1', number: '1', position: 'GK', status: 'Available', kpiNotes: 'Excellent distribution and shot stopping.' },
                    { id: 2, name: 'Fullback 1', number: '2', position: 'RB', status: 'Available', kpiNotes: 'High work rate, strong 1v1 defensive duel success.' },
                    { id: 3, name: 'Center Back 1', number: '4', position: 'CB', status: 'Available', kpiNotes: 'Dominant in aerial duels and build-up vision.' },
                    { id: 4, name: 'Center Back 2', number: '5', position: 'CB', status: 'Available', kpiNotes: 'Good recovery speed and vocal leadership.' },
                    { id: 5, name: 'Fullback 2', number: '3', position: 'LB', status: 'Available', kpiNotes: 'Effective overlapping runs in final third.' },
                    { id: 6, name: 'Defensive Mid', number: '6', position: 'CDM', status: 'Available', kpiNotes: 'Elite interception stats and press resistance.' },
                    { id: 7, name: 'Central Mid 1', number: '8', position: 'CM', status: 'Available', kpiNotes: 'Box-to-box engine, high passing accuracy.' },
                    { id: 8, name: 'Attacking Mid', number: '10', position: 'CAM', status: 'Available', kpiNotes: 'Creative key passes and clinical finishing.' },
                    { id: 9, name: 'Winger 1', number: '7', position: 'RW', status: 'Available', kpiNotes: 'Dangerous 1v1 isolation dribbler.' },
                    { id: 10, name: 'Center Forward', number: '9', position: 'ST', status: 'Available', kpiNotes: 'Clinical finisher, exceptional movement off the shoulder.' },
                    { id: 11, name: 'Winger 2', number: '11', position: 'LW', status: 'Available', kpiNotes: 'Direct pace, excellent tracking back.' }
                ];
            });

            const [lineup, setLineup] = React.useState(() => {
                const saved = localStorage.getItem('pro_soccer_lineup_v15');
                return saved ? JSON.parse(saved) : { formation: '4-3-3', gk: '1', rb: '2', cb1: '4', cb2: '5', lb: '3', cdm: '6', cm1: '8', cm2: '10', rw: '7', st: '9', lw: '11', notes: '' };
            });

            React.useEffect(() => { localStorage.setItem('pro_soccer_session_v15', JSON.stringify(sessionData)); }, [sessionData]);
            React.useEffect(() => { localStorage.setItem('pro_soccer_micro_v15', JSON.stringify(microcycle)); }, [microcycle]);
            React.useEffect(() => { localStorage.setItem('pro_soccer_drills_v15', JSON.stringify(drillBank)); }, [drillBank]);
            React.useEffect(() => { localStorage.setItem('pro_soccer_session_library_v15', JSON.stringify(sessionLibrary)); }, [sessionLibrary]);
            React.useEffect(() => { localStorage.setItem('pro_soccer_roster_v15', JSON.stringify(roster)); }, [roster]);
            React.useEffect(() => { localStorage.setItem('pro_soccer_lineup_v15', JSON.stringify(lineup)); }, [lineup]);

            const handleChange = (e) => {
                setSessionData({ ...sessionData, [e.target.name]: e.target.value });
            };

            const toggleCollapse = (num) => {
                setCollapsed({ ...collapsed, [num]: !collapsed[num] });
            };

            const copyActivity = (sourceNum, targetNum) => {
                setSessionData({
                    ...sessionData,
                    [`act${targetNum}Title`]: sessionData[`act${sourceNum}Title`] + ' (Copy)',
                    [`act${targetNum}Duration`]: sessionData[`act${sourceNum}Duration`],
                    [`act${targetNum}SetsReps`]: sessionData[`act${sourceNum}SetsReps`],
                    [`act${targetNum}Explanation`]: sessionData[`act${sourceNum}Explanation`],
                    [`act${targetNum}CoachingPoints`]: sessionData[`act${sourceNum}CoachingPoints`],
                    [`act${targetNum}Progression`]: sessionData[`act${sourceNum}Progression`],
                    [`act${targetNum}Canvas`]: JSON.parse(JSON.stringify(sessionData[`act${sourceNum}Canvas`]))
                });
                showToast(`Successfully copied Activity ${sourceNum} into Activity ${targetNum}!`);
            };

            const openSaveDrillModal = (num) => {
                setDrillSaveTargetActivity(String(num));
                setNewDrillTitle(sessionData[`act${num}Title`] || `Drill ${num}`);
                setNewDrillCategory('Rondo & Technical');
                setIsSaveDrillModalOpen(true);
            };

            const confirmSaveDrillToBank = () => {
                const num = drillSaveTargetActivity;
                const newDrill = {
                    id: 'drill_' + Date.now(),
                    title: newDrillTitle,
                    category: newDrillCategory,
                    explanation: sessionData[`act${num}Explanation`] || '',
                    coachingPoints: sessionData[`act${num}CoachingPoints`] || '',
                    canvas: JSON.parse(JSON.stringify(sessionData[`act${num}Canvas`] || {frames: [[]]}))
                };
                setDrillBank([...drillBank, newDrill]);
                setIsSaveDrillModalOpen(false);
                showToast(`Saved "${newDrill.title}" to your Drill Bank!`);
            };

            const loadDrillIntoActivity = (drill, targetNum) => {
                setSessionData({
                    ...sessionData,
                    [`act${targetNum}Title`]: drill.title,
                    [`act${targetNum}Explanation`]: drill.explanation,
                    [`act${targetNum}CoachingPoints`]: drill.coachingPoints,
                    [`act${targetNum}Canvas`]: JSON.parse(JSON.stringify(drill.canvas || {frames: [[]]}))
                });
                setViewMode('session');
                showToast(`Loaded drill into Activity ${targetNum}!`);
            };

            const saveCurrentSessionToLibrary = () => {
                const sessionName = prompt("Enter a name for this session (e.g., Build-up Phase vs Low Block):", sessionData.team ? `${sessionData.team} - ${sessionData.date || 'Session'}` : 'Unnamed Session');
                if (!sessionName) return;

                const savedItem = {
                    id: Date.now(),
                    name: sessionName,
                    savedAt: new Date().toLocaleDateString(),
                    data: sessionData
                };

                setSessionLibrary([...sessionLibrary, savedItem]);
                showToast(`Successfully saved "${sessionName}" to Session Library!`);
            };

            const loadSessionFromLibrary = (libItem) => {
                setSessionData(libItem.data);
                setViewMode('session');
                showToast(`Loaded session "${libItem.name}"!`);
            };

            const deleteSessionFromLibrary = (id, e) => {
                e.stopPropagation();
                if (confirm("Are you sure you want to delete this saved session?")) {
                    setSessionLibrary(sessionLibrary.filter(item => item.id !== id));
                    showToast("Deleted session from library.");
                }
            };

            const applyTacticalTag = (num, tagText) => {
                const key = `act${num}CoachingPoints`;
                const current = sessionData[key];
                const updated = current ? `${current}\n• ${tagText}` : `• ${tagText}`;
                setSessionData({ ...sessionData, [key]: updated });
                showToast(`Added tag: "${tagText}"`);
            };

            const commonTags = ["Third-man runs", "Pressing triggers", "Width & Depth", "Counter-pressing", "Compact defensive block", "Quick ball circulation", "Vertical penetration"];

            const handlePrint = () => {
                setIsPrinting(true);
                setCollapsed({ 1: false, 2: false, 3: false, 4: false });
                setTimeout(() => {
                    window.print();
                    setIsPrinting(false);
                }, 300);
            };

            const handlePdfDownload = () => {
                setIsPrinting(true);
                setCollapsed({ 1: false, 2: false, 3: false, 4: false });
                const element = document.getElementById('session-sheet-container');
                const opt = {
                    margin:       0.5,
                    filename:     `${sessionData.team || 'Training'}_Session_Plan.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
                };
                setTimeout(() => {
                    html2pdf().from(element).set(opt).save().then(() => {
                        setIsPrinting(false);
                        showToast("PDF Downloaded successfully!");
                    });
                }, 400);
            };

            return (
                <div className="max-w-6xl mx-auto p-4 sm:p-6 relative">
                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-emerald-500 text-xs font-bold animate-bounce flex items-center gap-2">
                            <span className="text-emerald-400 text-sm">✔</span> {toast}
                        </div>
                    )}

                    {/* FULLSCREEN SKETCHPAD MODAL */}
                    {fullscreenCanvas !== null && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 flex flex-col items-center justify-center p-4">
                            <div className="w-full max-w-4xl bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col items-center">
                                <div className="flex justify-between w-full items-center mb-3">
                                    <h3 className="font-bold text-white text-sm">Fullscreen Animated Pitch Editor — Activity {fullscreenCanvas}</h3>
                                    <button onClick={() => setFullscreenCanvas(null)} className="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-bold transition">Close ✕</button>
                                </div>
                                <div className="w-full flex justify-center">
                                    <div className="w-full max-w-[720px]">
                                        <TacticalSketchpad 
                                            initialData={sessionData[`act${fullscreenCanvas}Canvas`]}
                                            onSave={(data) => {
                                                setSessionData(prev => ({ ...prev, [`act${fullscreenCanvas}Canvas`]: data }));
                                            }}
                                            isPrinting={false}
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DRILL PREVIEW & EDIT MODAL */}
                    {activeDrillModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-300 flex flex-col gap-4">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                    <div>
                                        <span className="text-[10px] uppercase font-black text-emerald-700 tracking-wider bg-emerald-100 px-2 py-0.5 rounded-full">{activeDrillModal.category || 'Custom Drill'}</span>
                                        <h3 className="text-lg font-black text-slate-900 mt-1">{activeDrillModal.title}</h3>
                                    </div>
                                    <button onClick={() => setActiveDrillModal(null)} className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold w-8 h-8 rounded-full flex items-center justify-center transition">✕</button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <strong className="block text-slate-500 uppercase tracking-wider text-[10px] mb-1">Organization / Explanation:</strong>
                                        <p className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-slate-800 font-medium whitespace-pre-wrap">{activeDrillModal.explanation || 'No description provided.'}</p>
                                    </div>
                                    <div>
                                        <strong className="block text-slate-500 uppercase tracking-wider text-[10px] mb-1">Coaching Points:</strong>
                                        <p className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-slate-800 font-medium whitespace-pre-wrap">{activeDrillModal.coachingPoints || 'No coaching points listed.'}</p>
                                    </div>
                                </div>

                                <div className="border-t border-slate-200 pt-4 flex justify-between items-center">
                                    <span className="text-[11px] text-slate-500 font-bold">Load into active session:</span>
                                    <div className="flex gap-1.5">
                                        {[1, 2, 3, 4].map(num => (
                                            <button key={num} onClick={() => { loadDrillIntoActivity(activeDrillModal, num); setActiveDrillModal(null); }} className="bg-slate-900 hover:bg-slate-800 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition">Act {num}</button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SAVE DRILL MODAL */}
                    {isSaveDrillModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-300 flex flex-col gap-4">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                    <h3 className="text-base font-black text-slate-900">Save Drill to Library</h3>
                                    <button onClick={() => setIsSaveDrillModalOpen(false)} className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold w-8 h-8 rounded-full flex items-center justify-center transition">✕</button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Drill Title</label>
                                        <input type="text" value={newDrillTitle} onChange={(e) => setNewDrillTitle(e.target.value)} className="w-full border border-slate-300 p-2.5 rounded-lg font-bold text-slate-900 focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Category</label>
                                        <select value={newDrillCategory} onChange={(e) => setNewDrillCategory(e.target.value)} className="w-full border border-slate-300 p-2.5 rounded-lg font-bold text-slate-900 bg-white focus:outline-none">
                                            <option value="Rondo & Technical">Rondo & Technical</option>
                                            <option value="Build-up & Possession">Build-up & Possession</option>
                                            <option value="Pressing & Defense">Pressing & Defense</option>
                                            <option value="Attacking & Finishing">Attacking & Finishing</option>
                                            <option value="Conditioned Games">Conditioned Games</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Source Activity</label>
                                        <select value={drillSaveTargetActivity} onChange={(e) => {
                                            const num = e.target.value;
                                            setDrillSaveTargetActivity(num);
                                            setNewDrillTitle(sessionData[`act${num}Title`] || `Drill ${num}`);
                                        }} className="w-full border border-slate-300 p-2.5 rounded-lg font-bold text-slate-900 bg-white focus:outline-none">
                                            <option value="1">Activity 1: {sessionData.act1Title}</option>
                                            <option value="2">Activity 2: {sessionData.act2Title}</option>
                                            <option value="3">Activity 3: {sessionData.act3Title}</option>
                                            <option value="4">Activity 4: {sessionData.act4Title}</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="border-t border-slate-200 pt-4 flex justify-end gap-2">
                                    <button onClick={() => setIsSaveDrillModalOpen(false)} className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-lg text-xs transition">Cancel</button>
                                    <button onClick={confirmSaveDrillToBank} className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-lg text-xs shadow transition">Save Drill</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-wrap justify-between items-center mb-6 bg-white p-5 rounded-xl shadow-md border border-slate-200 print:hidden gap-3">
                        <div>
                            <div className="flex items-center gap-2 mb-1">
                                <span className="w-2.5 h-2.5 rounded-full bg-emerald-600 inline-block"></span>
                                <h1 className="font-black tracking-wider uppercase text-slate-900 text-base sm:text-lg">Pro Session Planner & Club Suite</h1>
                            </div>
                            <p className="text-xs text-slate-500">Periodized session sheets, animated diagrams, squad roster, and starting XI lineup.</p>
                        </div>
                        <div className="flex flex-wrap gap-1.5 items-center">

                                return matchesCat && matchesSearch;
                            }).length === 0 ? (
                                <p className="text-sm text-slate-500 italic bg-slate-50 p-6 rounded-xl border border-dashed border-slate-300 text-center">No drills found matching your criteria.</p>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {drillBank.filter(d => {
                                        const matchesCat = selectedDrillCategory === 'All' || d.category === selectedDrillCategory;
                                        const matchesSearch = d.title.toLowerCase().includes(drillSearchQuery.toLowerCase()) || (d.explanation && d.explanation.toLowerCase().includes(drillSearchQuery.toLowerCase()));
                                        return matchesCat && matchesSearch;
                                    }).map((drill) => (
                                        <div key={drill.id} className="border border-slate-200 rounded-xl p-4.5 bg-slate-50 flex flex-col justify-between shadow-sm hover:border-slate-400 transition">
                                            <div>
                                                <div className="flex justify-between items-start mb-2">
                                                    <span className="text-[10px] uppercase font-black text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">{drill.category || 'Custom'}</span>
                                                    {!drill.isPreset && (
                                                        <button onClick={() => {
                                                            setDrillBank(drillBank.filter(d => d.id !== drill.id));
                                                            showToast("Deleted drill from bank.");
                                                        }} className="text-red-600 hover:text-red-800 font-bold text-xs">Delete</button>
                                                    )}
                                                </div>
                                                <h3 className="font-black text-slate-900 text-sm mb-1">{drill.title}</h3>
                                                <p className="text-xs text-slate-600 mb-3 line-clamp-2"><strong>Org:</strong> {drill.explanation || 'No description'}</p>
                                            </div>
                                            <div className="flex justify-between items-center mt-3 pt-3 border-t border-slate-200">
                                                <button onClick={() => setActiveDrillModal(drill)} className="text-emerald-700 font-bold text-xs hover:underline">👁️ Preview & Edit</button>
                                                <div className="flex gap-1.5 items-center">
                                                    <span className="text-[10px] text-slate-400 font-bold">Load:</span>
                                                    {[1, 2, 3, 4].map(num => (
                                                        <button key={num} onClick={() => loadDrillIntoActivity(drill, num)} className="bg-slate-900 hover:bg-slate-800 text-white px-2 py-0.5 rounded text-[11px] font-bold transition">Act {num}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {viewMode === 'sessionlibrary' && (
                        <div className="bg-white border-2 border-slate-900 shadow-xl p-6 sm:p-8 rounded-xl">
                            <h2 className="text-lg font-black uppercase text-slate-900 mb-1">Saved Session Library</h2>
                            <p className="text-xs text-slate-500 mb-6">Reopen, review, or continue editing finished and unfinished training sessions.</p>
                            {sessionLibrary.length === 0 ? (
                                <p className="text-sm text-slate-500 italic bg-slate-50 p-6 rounded-xl border border-dashed border-slate-300 text-center">No saved sessions in your library yet. Click "Save Session to Library" at the top of the Session Sheet tab to save your work.</p>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {sessionLibrary.map((item) => (
                                        <div key={item.id} onClick={() => loadSessionFromLibrary(item)} className="border border-slate-200 rounded-xl p-4.5 bg-slate-50 hover:bg-emerald-50/60 cursor-pointer flex flex-col justify-between shadow-sm transition">
                                            <div>
                                                <div className="flex justify-between items-start mb-1">
                                                    <h3 className="font-black text-slate-900 text-sm">{item.name}</h3>
                                                    <button onClick={(e) => deleteSessionFromLibrary(item.id, e)} className="text-red-600 hover:text-red-800 font-bold text-xs px-2 py-0.5 rounded transition">Delete</button>
                                                </div>
                                                <p className="text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-3">Saved: {item.savedAt}</p>
                                                <p className="text-xs text-slate-600 mb-1"><strong>Team:</strong> {item.data.team || 'Not specified'}</p>
                                                <p className="text-xs text-slate-600 mb-3"><strong>Date:</strong> {item.data.date || 'Not specified'}</p>
                                            </div>
                                            <div className="text-emerald-700 font-bold text-xs flex items-center gap-1">
                                                <span>Click to Reopen Session →</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
