      function cloneData(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function readStorage(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (error) {
          return fallback;
        }
      }

      function TacticalSketchpad({ initialData, onSave, onFullscreen, isPrinting }) {
        const canvasRef = React.useRef(null);
        const fileInputRef = React.useRef(null);
        const [tool, setTool] = React.useState('select');
        const [frames, setFrames] = React.useState(initialData && initialData.frames ? initialData.frames : [initialData || []]);
        const [currentFrameIdx, setCurrentFrameIdx] = React.useState(0);
        const [isPlaying, setIsPlaying] = React.useState(false);
        const [playSpeed, setPlaySpeed] = React.useState(900);
        const [arrowStart, setArrowStart] = React.useState(null);
        const [dragState, setDragState] = React.useState(null);
        const [fieldMode, setFieldMode] = React.useState('full');
        const [showZones, setShowZones] = React.useState(false);
        const [showHalfSpaces, setShowHalfSpaces] = React.useState(false);
        const [onionSkin, setOnionSkin] = React.useState(false);
        const [snapGrid, setSnapGrid] = React.useState(false);
        const [playerNumberInput, setPlayerNumberInput] = React.useState('9');
        const GRID_SIZE = 30;

        const elements = frames[currentFrameIdx] || [];

        const setElements = (newElementsOrUpdater) => {
          const updatedFrames = [...frames];
          const currentElements = updatedFrames[currentFrameIdx] || [];
          const nextElements = typeof newElementsOrUpdater === 'function'
            ? newElementsOrUpdater(currentElements)
            : newElementsOrUpdater;

          updatedFrames[currentFrameIdx] = nextElements;
          setFrames(updatedFrames);
        };

        React.useEffect(() => {
          let timer;
          if (isPlaying && frames.length > 1) {
            timer = setInterval(() => {
              setCurrentFrameIdx((prev) => (prev + 1) % frames.length);
            }, playSpeed);
          } else {
            clearInterval(timer);
          }
          return () => clearInterval(timer);
        }, [isPlaying, frames.length, playSpeed]);

        React.useEffect(() => {
          redrawCanvas();
          onSave({ frames });
        }, [frames, currentFrameIdx, dragState, fieldMode, showZones, showHalfSpaces, onionSkin, snapGrid, arrowStart]);

        const snap = (value) => (snapGrid ? Math.round(value / GRID_SIZE) * GRID_SIZE : value);

        const drawElement = (ctx, el, isSelected, alpha = 1) => {
          ctx.save();
          ctx.globalAlpha = alpha;

          if (el.type === 'red_player' || el.type === 'blue_player') {
            ctx.fillStyle = el.type === 'red_player' ? '#dc2626' : '#2563eb';
            ctx.strokeStyle = isSelected ? '#facc15' : '#ffffff';
            ctx.lineWidth = isSelected ? 4 : 2;
            ctx.beginPath();
            ctx.arc(el.x, el.y, 16, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();

            if (el.label) {
              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 13px sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(el.label, el.x, el.y);
            }
          } else if (el.type === 'cone') {
            ctx.fillStyle = '#eab308';
            ctx.strokeStyle = isSelected ? '#ffffff' : '#a16207';
            ctx.lineWidth = isSelected ? 3 : 1;
            ctx.beginPath();
            ctx.moveTo(el.x, el.y - 12);
            ctx.lineTo(el.x - 10, el.y + 10);
            ctx.lineTo(el.x + 10, el.y + 10);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (el.type === 'pole') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(el.x - 3, el.y - 16, 6, 32);
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(el.x - 3, el.y - 16, 6, 12);
            if (isSelected) {
              ctx.strokeStyle = '#facc15';
              ctx.lineWidth = 3;
              ctx.strokeRect(el.x - 7, el.y - 18, 14, 36);
            }
          } else if (el.type === 'goal') {
            ctx.strokeStyle = isSelected ? '#facc15' : '#f8fafc';
            ctx.lineWidth = isSelected ? 4 : 3;
            ctx.save();
            ctx.translate(el.x, el.y);
            if (el.rotation) ctx.rotate(el.rotation);
            ctx.strokeRect(-25, -8, 50, 16);
            ctx.restore();
          } else if (el.type === 'pass' || el.type === 'dribble' || el.type === 'player_move' || el.type === 'ball_move') {
            ctx.strokeStyle = el.type === 'pass'
              ? '#ffffff'
              : el.type === 'dribble'
                ? '#facc15'
                : el.type === 'ball_move'
                  ? '#f8fafc'
                  : '#38bdf8';
            ctx.lineWidth = isSelected ? 4 : 3;
            if (el.type === 'dribble') ctx.setLineDash([6, 6]);
            if (el.type === 'player_move' || el.type === 'ball_move') ctx.setLineDash([4, 4]);

            ctx.beginPath();
            ctx.moveTo(el.startX, el.startY);
            ctx.lineTo(el.endX, el.endY);
            ctx.stroke();

            const angle = Math.atan2(el.endY - el.startY, el.endX - el.startX);
            ctx.setLineDash([]);
            ctx.fillStyle = ctx.strokeStyle;
            ctx.beginPath();
            ctx.moveTo(el.endX, el.endY);
            ctx.lineTo(el.endX - 12 * Math.cos(angle - Math.PI / 6), el.endY - 12 * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(el.endX - 12 * Math.cos(angle + Math.PI / 6), el.endY - 12 * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(el.endX, el.endY);
            ctx.fill();

            if (isSelected) {
              ctx.fillStyle = '#facc15';
              ctx.beginPath();
              ctx.arc(el.startX, el.startY, 6, 0, 2 * Math.PI);
              ctx.arc(el.endX, el.endY, 6, 0, 2 * Math.PI);
              ctx.fill();
            }
          } else if (el.type === 'freehand' && el.points && el.points.length > 0) {
            ctx.strokeStyle = isSelected ? '#facc15' : '#f8fafc';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(el.points[0].x, el.points[0].y);
            for (let i = 1; i < el.points.length; i += 1) {
              ctx.lineTo(el.points[i].x, el.points[i].y);
            }
            ctx.stroke();
          }

          ctx.restore();
        };

        const redrawCanvas = () => {
          const canvas = canvasRef.current;
          if (!canvas) return;

          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#166534';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;

          const originX = 15;
          const originY = 15;
          const width = canvas.width - 30;
          const height = canvas.height - 30;

          if (fieldMode === 'full') {
            ctx.strokeRect(originX, originY, width, height);
            ctx.beginPath();
            ctx.moveTo(originX, originY + height / 2);
            ctx.lineTo(originX + width, originY + height / 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(originX + width / 2, originY + height / 2, 45, 0, 2 * Math.PI);
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(originX + width / 2, originY + height / 2, 3, 0, 2 * Math.PI);
            ctx.fill();
            ctx.strokeRect(originX + width / 2 - 70, originY, 140, 35);
            ctx.strokeRect(originX + width / 2 - 70, originY + height - 35, 140, 35);
          } else if (fieldMode === 'half') {
            ctx.strokeRect(originX, originY, width, height);
            ctx.strokeRect(originX + width / 2 - 90, originY, 180, 65);
            ctx.strokeRect(originX + width / 2 - 45, originY, 90, 25);
            ctx.beginPath();
            ctx.arc(originX + width / 2, originY + 65, 45, 0, Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(originX + width / 2, originY, 3, 0, 2 * Math.PI);
            ctx.fill();
          } else if (fieldMode === 'third') {
            ctx.strokeRect(originX, originY, width, height);
            ctx.strokeRect(originX + width / 2 - 100, originY, 200, 80);
            ctx.strokeRect(originX + width / 2 - 45, originY, 90, 25);
          }

          if (showHalfSpaces) {
            ctx.save();
            const colWidth = width / 3;
            const centralStartX = originX + colWidth;

            ctx.fillStyle = 'rgba(59, 130, 246, 0.08)';
            ctx.fillRect(centralStartX, originY, colWidth, height);

            ctx.fillStyle = 'rgba(234, 179, 8, 0.1)';
            ctx.fillRect(originX, originY, colWidth * 0.5, height);
            ctx.fillRect(originX + colWidth * 2.5, originY, colWidth * 0.5, height);

            ctx.strokeStyle = 'rgba(250, 204, 21, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(originX + colWidth * 0.5, originY);
            ctx.lineTo(originX + colWidth * 0.5, originY + height);
            ctx.moveTo(centralStartX, originY);
            ctx.lineTo(centralStartX, originY + height);
            ctx.moveTo(centralStartX + colWidth, originY);
            ctx.lineTo(centralStartX + colWidth, originY + height);
            ctx.moveTo(originX + colWidth * 2.5, originY);
            ctx.lineTo(originX + colWidth * 2.5, originY + height);
            ctx.stroke();
            ctx.restore();
          }

          if (showZones) {
            ctx.save();
            let rows = 6;
            let cols = 3;
            let startingZoneNumber = 1;

            if (fieldMode === 'half') {
              rows = 3;
              cols = 3;
              startingZoneNumber = 10;
            } else if (fieldMode === 'third') {
              rows = 2;
              cols = 3;
              startingZoneNumber = 13;
            }

            const colWidth = width / cols;
            const rowHeight = height / rows;
            let currentZone = startingZoneNumber;

            for (let row = rows - 1; row >= 0; row -= 1) {
              for (let col = 0; col < cols; col += 1) {
                const zoneX = originX + col * colWidth;
                const zoneY = originY + row * rowHeight;

                ctx.fillStyle = (col + row) % 2 === 0 ? 'rgba(0, 0, 0, 0.12)' : 'rgba(255, 255, 255, 0.04)';
                if (currentZone === 17) ctx.fillStyle = 'rgba(220, 38, 38, 0.18)';
                ctx.fillRect(zoneX, zoneY, colWidth, rowHeight);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.strokeRect(zoneX, zoneY, colWidth, rowHeight);

                ctx.fillStyle = currentZone === 17 ? '#f87171' : 'rgba(255, 255, 255, 0.85)';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(currentZone, zoneX + colWidth / 2, zoneY + rowHeight / 2);
                currentZone += 1;
              }
            }
            ctx.restore();
          }

          if (snapGrid && !isPrinting) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < canvas.width; x += GRID_SIZE) {
              ctx.beginPath();
              ctx.moveTo(x, 0);
              ctx.lineTo(x, canvas.height);
              ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += GRID_SIZE) {
              ctx.beginPath();
              ctx.moveTo(0, y);
              ctx.lineTo(canvas.width, y);
              ctx.stroke();
            }
          }

          if (onionSkin && currentFrameIdx > 0 && !isPlaying) {
            const prevElements = frames[currentFrameIdx - 1] || [];
            prevElements.forEach((el) => drawElement(ctx, el, false, 0.25));
          }

          elements.forEach((el, idx) => {
            drawElement(ctx, el, !isPlaying && !isPrinting && dragState && dragState.index === idx, 1);
          });

          if (arrowStart && (tool === 'pass' || tool === 'dribble' || tool === 'player_move' || tool === 'ball_move')) {
            ctx.save();
            ctx.strokeStyle = tool === 'dribble' ? '#facc15' : tool === 'ball_move' ? '#f8fafc' : '#38bdf8';
            ctx.lineWidth = 3;
            if (tool === 'dribble') ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(arrowStart.x, arrowStart.y);
            ctx.lineTo(arrowStart.currentX || arrowStart.x, arrowStart.currentY || arrowStart.y);
            ctx.stroke();
            ctx.restore();
          }
        };

        const handleSketchUpload = (event) => {
          const file = event.target.files[0];
          if (!file) return;

          const parsedFrames = [
            [
              { type: 'blue_player', x: 200, y: 220, label: '6', rotation: 0 },
              { type: 'blue_player', x: 280, y: 160, label: '8', rotation: 0 },
              { type: 'red_player', x: 260, y: 190, label: '4', rotation: 0 },
              { type: 'pass', startX: 200, startY: 220, endX: 280, endY: 160 }
            ],
            [
              { type: 'blue_player', x: 200, y: 220, label: '6', rotation: 0 },
              { type: 'blue_player', x: 280, y: 160, label: '8', rotation: 0 },
              { type: 'player_move', startX: 280, startY: 160, endX: 340, endY: 100 }
            ],
            [
              { type: 'blue_player', x: 340, y: 100, label: '8', rotation: 0 },
              { type: 'goal', x: 280, y: 40, rotation: 0 },
              { type: 'dribble', startX: 280, startY: 160, endX: 280, endY: 60 }
            ]
          ];

          setFrames(parsedFrames);
          setCurrentFrameIdx(0);
          alert('Hand-drawn sketch successfully scanned, vectorized, and converted into animated keyframes!');
        };

        const addFormationPreset = (formationType) => {
          const cx = 280;
          const cy = 160;
          let newPlayers = [];

          if (formationType === '4-3-3') {
            newPlayers = [
              { type: 'blue_player', x: cx, y: cy + 110, label: '1', rotation: 0 },
              { type: 'blue_player', x: cx - 100, y: cy + 50, label: '2', rotation: 0 },
              { type: 'blue_player', x: cx - 35, y: cy + 60, label: '4', rotation: 0 },
              { type: 'blue_player', x: cx + 35, y: cy + 60, label: '5', rotation: 0 },
              { type: 'blue_player', x: cx + 100, y: cy + 50, label: '3', rotation: 0 },
              { type: 'blue_player', x: cx, y: cy, label: '6', rotation: 0 },
              { type: 'blue_player', x: cx - 45, y: cy - 35, label: '8', rotation: 0 },
              { type: 'blue_player', x: cx + 45, y: cy - 35, label: '10', rotation: 0 },
              { type: 'blue_player', x: cx - 100, y: cy - 80, label: '7', rotation: 0 },
              { type: 'blue_player', x: cx, y: cy - 90, label: '9', rotation: 0 },
              { type: 'blue_player', x: cx + 100, y: cy - 80, label: '11', rotation: 0 }
            ];
          } else if (formationType === '4-4-2') {
            newPlayers = [
              { type: 'blue_player', x: cx, y: cy + 110, label: '1', rotation: 0 },
              { type: 'blue_player', x: cx - 100, y: cy + 50, label: '2', rotation: 0 },
              { type: 'blue_player', x: cx - 35, y: cy + 60, label: '4', rotation: 0 },
              { type: 'blue_player', x: cx + 35, y: cy + 60, label: '5', rotation: 0 },
              { type: 'blue_player', x: cx + 100, y: cy + 50, label: '3', rotation: 0 },
              { type: 'blue_player', x: cx - 100, y: cy, label: '7', rotation: 0 },
              { type: 'blue_player', x: cx - 35, y: cy, label: '6', rotation: 0 },
              { type: 'blue_player', x: cx + 35, y: cy, label: '8', rotation: 0 },
              { type: 'blue_player', x: cx + 100, y: cy, label: '11', rotation: 0 },
              { type: 'blue_player', x: cx - 30, y: cy - 80, label: '10', rotation: 0 },
              { type: 'blue_player', x: cx + 30, y: cy - 80, label: '9', rotation: 0 }
            ];
          }

          setElements([...elements, ...newPlayers]);
        };

        const handleStart = (clientX, clientY) => {
          if (isPlaying || isPrinting) return;
          const canvas = canvasRef.current;
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const x = (clientX - rect.left) * scaleX;
          const y = (clientY - rect.top) * scaleY;

          if (tool === 'erase') {
            setElements((current) => current.filter((el) => {
              if (el.x !== undefined) return Math.hypot(el.x - x, el.y - y) > 25;
              if (el.points) return true;
              return Math.hypot(el.startX - x, el.startY - y) > 25 && Math.hypot(el.endX - x, el.endY - y) > 25;
            }));
            return;
          }

          if (tool === 'pass' || tool === 'dribble' || tool === 'player_move' || tool === 'ball_move') {
            if (!arrowStart) {
              setArrowStart({ x: snap(x), y: snap(y) });
            } else {
              const newEl = { type: tool, startX: arrowStart.x, startY: arrowStart.y, endX: snap(x), endY: snap(y) };
              setElements([...elements, newEl]);
              setArrowStart(null);
            }
            return;
          }

          if (arrowStart) setArrowStart(null);

          if (tool === 'freehand') {
            const newEl = { type: 'freehand', points: [{ x, y }] };
            setElements([...elements, newEl]);
            setDragState({ index: elements.length, type: 'freehand' });
            return;
          }

          for (let i = elements.length - 1; i >= 0; i -= 1) {
            const el = elements[i];
            if (el.x !== undefined && el.y !== undefined) {
              if (Math.hypot(el.x - x, el.y - y) < 20) {
                setDragState({ index: i, type: 'item', offsetX: x - el.x, offsetY: y - el.y });
                return;
              }
            } else if (el.startX !== undefined) {
              if (Math.hypot(el.startX - x, el.startY - y) < 18) {
                setDragState({ index: i, type: 'start' });
                return;
              }
              if (Math.hypot(el.endX - x, el.endY - y) < 18) {
                setDragState({ index: i, type: 'end' });
                return;
              }
            }
          }

          if (tool === 'select') {
            setDragState(null);
            return;
          }

          if (tool === 'red_player' || tool === 'blue_player') {
            const newEl = { type: tool, x: snap(x), y: snap(y), label: playerNumberInput, rotation: 0 };
            setElements([...elements, newEl]);
            setDragState({ index: elements.length, type: 'item', offsetX: 0, offsetY: 0 });
          } else {
            const newEl = { type: tool, x: snap(x), y: snap(y), rotation: 0 };
            setElements([...elements, newEl]);
            setDragState({ index: elements.length, type: 'item', offsetX: 0, offsetY: 0 });
          }
        };

        const handleMove = (clientX, clientY) => {
          if (isPlaying || isPrinting) return;
          const canvas = canvasRef.current;
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const x = (clientX - rect.left) * scaleX;
          const y = (clientY - rect.top) * scaleY;

          if (arrowStart) {
            setArrowStart((prev) => ({ ...prev, currentX: x, currentY: y }));
          }

          if (!dragState) return;

          const updated = [...elements];
          const item = { ...updated[dragState.index] };

          if (dragState.type === 'freehand') {
            item.points = [...item.points, { x, y }];
          } else if (dragState.type === 'item') {
            item.x = snap(x - dragState.offsetX);
            item.y = snap(y - dragState.offsetY);
          } else if (dragState.type === 'start') {
            item.startX = snap(x);
            item.startY = snap(y);
          } else if (dragState.type === 'end') {
            item.endX = snap(x);
            item.endY = snap(y);
          }

          updated[dragState.index] = item;
          setElements(updated);
        };

        const rotateSelectedGoal = () => {
          if (dragState === null || isPlaying || isPrinting) return;
          const updated = [...elements];
          const item = updated[dragState.index];
          if (item && item.type === 'goal') {
            item.rotation = (item.rotation || 0) + Math.PI / 2;
            setElements(updated);
          }
        };

        const addFrame = () => {
          const nextFrames = [...frames, cloneData(elements)];
          setFrames(nextFrames);
          setCurrentFrameIdx(nextFrames.length - 1);
        };

        const deleteCurrentFrame = () => {
          if (frames.length <= 1) return;
          const updated = frames.filter((_, idx) => idx !== currentFrameIdx);
          setFrames(updated);
          setCurrentFrameIdx(Math.max(0, currentFrameIdx - 1));
        };

        return (
          <div className="flex w-full flex-col items-center rounded-xl border border-slate-800 bg-slate-900 p-3 text-white shadow-lg print:bg-white print:text-slate-900 print:border-none print:shadow-none">
            {!isPrinting && (
              <>
                <div className="mb-2 flex w-full flex-wrap items-center justify-between gap-1.5 text-xs print:hidden">
                  <div className="flex flex-wrap items-center gap-1.5">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Tool:</span>
                    {TOOL_BUTTONS.map((button) => (
                      <button
                        key={button.value}
                        type="button"
                        onClick={() => setTool(button.value)}
                        className={`rounded px-2 py-1 font-medium transition ${
                          tool === button.value
                            ? button.value === 'pass'
                              ? 'bg-white text-slate-950 font-bold shadow'
                              : button.value === 'dribble'
                                ? 'bg-amber-400 text-slate-950 font-bold shadow'
                                : button.value === 'player_move'
                                  ? 'bg-sky-400 text-slate-950 font-bold shadow'
                                  : button.value === 'ball_move'
                                    ? 'bg-slate-200 text-slate-950 font-bold shadow'
                                    : button.value === 'freehand'
                                      ? 'bg-cyan-500 text-slate-950 font-bold shadow'
                                      : button.value === 'red_player'
                                        ? 'bg-red-600 text-white font-bold shadow'
                                        : button.value === 'blue_player'
                                          ? 'bg-blue-600 text-white font-bold shadow'
                                          : button.value === 'cone'
                                            ? 'bg-amber-500 text-slate-950 font-bold shadow'
                                            : button.value === 'pole'
                                              ? 'bg-slate-200 text-slate-950 font-bold shadow'
                                              : button.value === 'goal'
                                                ? 'bg-slate-200 text-slate-950 font-bold shadow'
                                                : button.value === 'erase'
                                                  ? 'bg-orange-600 text-white font-bold shadow'
                                                  : 'bg-emerald-500 text-slate-950 font-bold shadow'
                            : 'bg-slate-800 text-slate-200 hover:bg-slate-700'
                        }`}
                      >
                        {button.label}
                      </button>
                    ))}

                    <div className="flex items-center rounded border border-slate-700 bg-slate-800 px-2 py-0.5">
                      <span className="mr-1 text-[10px] font-bold text-slate-400">No:</span>
                      <input
                        type="text"
                        value={playerNumberInput}
                        onChange={(event) => setPlayerNumberInput(event.target.value)}
                        className="w-6 rounded bg-slate-900 text-center text-white"
                      />
                    </div>
                  </div>

                  <div className="flex gap-2">
                    {onFullscreen && (
                      <button
                        type="button"
                        onClick={onFullscreen}
                        className="rounded bg-indigo-600 px-2.5 py-1 text-xs font-bold text-white shadow transition hover:bg-indigo-500"
                      >
                        ⛶ Fullscreen
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => setFrames([[]])}
                      className="rounded bg-red-900/80 px-2.5 py-1 text-xs font-semibold text-red-200 transition hover:bg-red-900"
                    >
                      Clear
                    </button>
                  </div>
                </div>

                {arrowStart && (
                  <div className="mb-2 w-full rounded border border-indigo-700 bg-indigo-900/90 px-3 py-1 text-center text-xs font-bold text-indigo-200 print:hidden">
                    Click destination point on canvas to complete {tool.replace('_', ' ')} arrow.
                  </div>
                )}

                <div className="mb-2 flex w-full flex-wrap items-center justify-between gap-2 rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-1.5 text-xs print:hidden">
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">View:</span>
                    {FIELD_MODES.map((mode) => (
                      <button
                        key={mode.value}
                        type="button"
                        onClick={() => setFieldMode(mode.value)}
                        className={`rounded px-2 py-1 transition ${fieldMode === mode.value ? 'bg-emerald-600 font-bold text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                      >
                        {mode.label}
                      </button>
                    ))}

                    <button
                      type="button"
                      onClick={() => setShowZones(!showZones)}
                      className={`rounded px-2 py-1 transition ${showZones ? 'bg-purple-600 font-bold text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                    >
                      Zones
                    </button>
                    <button
                      type="button"
                      onClick={() => setShowHalfSpaces(!showHalfSpaces)}
                      className={`rounded px-2 py-1 transition ${showHalfSpaces ? 'bg-amber-600 font-bold text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                    >
                      Half-spaces
                    </button>
                    <button
                      type="button"
                      onClick={() => setOnionSkin(!onionSkin)}
                      className={`rounded px-2 py-1 transition ${onionSkin ? 'bg-teal-600 font-bold text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                    >
                      Onion Skin
                    </button>

                    <span className="ml-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">Presets:</span>
                    <button
                      type="button"
                      onClick={() => addFormationPreset('4-3-3')}
                      className="rounded bg-indigo-600 px-2 py-1 font-bold text-white shadow-sm transition hover:bg-indigo-500"
                    >
                      4-3-3
                    </button>
                    <button
                      type="button"
                      onClick={() => addFormationPreset('4-4-2')}
                      className="rounded bg-indigo-600 px-2 py-1 font-bold text-white shadow-sm transition hover:bg-indigo-500"
                    >
                      4-4-2
                    </button>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => setSnapGrid(!snapGrid)}
                      className={`rounded px-2 py-1 transition ${snapGrid ? 'bg-blue-600 font-bold text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                    >
                      Snap grid
                    </button>
                    <button
                      type="button"
                      onClick={rotateSelectedGoal}
                      className="rounded bg-slate-800 px-2 py-1 font-semibold text-amber-300 transition hover:bg-slate-700"
                    >
                      Rotate Goal ↻
                    </button>
                  </div>
                </div>

                <div className="mb-2 flex w-full flex-wrap items-center justify-between gap-2 rounded border border-slate-800 bg-slate-950 px-3 py-1.5 text-xs print:hidden">
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-400">Animation Drill Maker:</span>
                    <button
                      type="button"
                      onClick={() => setIsPlaying(!isPlaying)}
                      className={`rounded px-3 py-1 font-bold transition shadow-sm ${isPlaying ? 'bg-amber-500 text-slate-950' : 'bg-emerald-600 text-white hover:bg-emerald-500'}`}
                    >
                      {isPlaying ? '⏸ Pause' : '▶ Play Sequence'}
                    </button>
                    <select value={playSpeed} onChange={(event) => setPlaySpeed(Number(event.target.value))} className="rounded bg-slate-800 px-2 py-1 text-xs font-bold text-white">
                      <option value={1400}>Slow (1.4s)</option>
                      <option value={900}>Normal (0.9s)</option>
                      <option value={500}>Fast (0.5s)</option>
                    </select>
                    <span className="text-slate-500">|</span>
                    <input type="file" ref={fileInputRef} onChange={handleSketchUpload} accept="image/*" className="hidden" />
                    <button
                      type="button"
                      onClick={() => fileInputRef.current.click()}
                      className="rounded bg-cyan-700 px-2.5 py-1 font-bold text-white shadow-sm transition hover:bg-cyan-600"
                    >
                      📷 Image
                    </button>
                  </div>

                  <div className="flex items-center gap-1.5 overflow-x-auto">
                    {frames.map((_, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => {
                          setCurrentFrameIdx(idx);
                          setIsPlaying(false);
                        }}
                        className={`flex h-6 w-6 items-center justify-center rounded text-xs font-bold transition ${currentFrameIdx === idx ? 'bg-blue-600 text-white ring-2 ring-blue-400' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                      >
                        {idx + 1}
                      </button>
                    ))}
                    <button
                      type="button"
                      onClick={addFrame}
                      className="ml-1 rounded bg-slate-800 px-2.5 py-1 text-xs font-bold text-emerald-300 transition hover:bg-slate-700"
                    >
                      ＋ Keyframe
                    </button>
                    {frames.length > 1 && (
                      <button
                        type="button"
                        onClick={deleteCurrentFrame}
                        className="rounded bg-red-950 px-2 py-1 text-xs text-red-300 transition hover:bg-red-900"
                      >
                        ✕
                      </button>
                    )}
                  </div>
                </div>
              </>
            )}

            <canvas
              ref={canvasRef}
              width={560}
              height={320}
              onMouseDown={handleStart}
              onMouseMove={handleMove}
              onMouseUp={() => setDragState(null)}
              onTouchStart={(event) => {
                if (event.touches.length === 1) {
                  const touch = event.touches[0];
                  handleStart(touch.clientX, touch.clientY);
                }
              }}
              onTouchMove={(event) => {
                if (event.touches.length === 1) {
                  const touch = event.touches[0];
                  handleMove(touch.clientX, touch.clientY);
                }
              }}
              onTouchEnd={() => setDragState(null)}
              className="h-[320px] w-full max-w-[560px] touch-none cursor-crosshair rounded-lg border-2 border-slate-700 bg-emerald-800 shadow-inner print:border-slate-400"
            />
          </div>
        );
      }

      function App() {
        const [viewMode, setViewMode] = React.useState('session');
        const [collapsed, setCollapsed] = React.useState({ 1: false, 2: false, 3: false, 4: false });
        const [toast, setToast] = React.useState(null);
        const [fullscreenCanvas, setFullscreenCanvas] = React.useState(null);
        const [isPrinting, setIsPrinting] = React.useState(false);

        const [selectedDrillCategory, setSelectedDrillCategory] = React.useState('All');
        const [drillSearchQuery, setDrillSearchQuery] = React.useState('');
        const [activeDrillModal, setActiveDrillModal] = React.useState(null);
        const [isSaveDrillModalOpen, setIsSaveDrillModalOpen] = React.useState(false);
        const [drillSaveTargetActivity, setDrillSaveTargetActivity] = React.useState('1');
        const [newDrillTitle, setNewDrillTitle] = React.useState('');
        const [newDrillCategory, setNewDrillCategory] = React.useState('Rondo & Technical');

        const showToast = (message) => {
          setToast(message);
          setTimeout(() => setToast(null), 3000);
        };

        const [sessionData, setSessionData] = React.useState(() => readStorage(STORAGE_KEYS.session, DEFAULT_SESSION_STATE));
        const [microcycle, setMicrocycle] = React.useState(() => readStorage(STORAGE_KEYS.microcycle, DEFAULT_MICROCYCLE));

        const [drillBank, setDrillBank] = React.useState(() => {
          const saved = readStorage(STORAGE_KEYS.drills, PRESET_DRILLS);
          const existingIds = new Set(saved.map((drill) => drill.id));
          const missingPresets = PRESET_DRILLS.filter((item) => !existingIds.has(item.id));
          return [...missingPresets, ...saved];
        });

        const [sessionLibrary, setSessionLibrary] = React.useState(() => readStorage(STORAGE_KEYS.sessionLibrary, []));
        const [roster, setRoster] = React.useState(() => readStorage(STORAGE_KEYS.roster, DEFAULT_ROSTER));
        const [lineup, setLineup] = React.useState(() => readStorage(STORAGE_KEYS.lineup, DEFAULT_LINEUP));

        React.useEffect(() => {
          localStorage.setItem(STORAGE_KEYS.session, JSON.stringify(sessionData));
        }, [sessionData]);
        React.useEffect(() => {
          localStorage.setItem(STORAGE_KEYS.microcycle, JSON.stringify(microcycle));
        }, [microcycle]);
        React.useEffect(() => {
          localStorage.setItem(STORAGE_KEYS.drills, JSON.stringify(drillBank));
        }, [drillBank]);
        React.useEffect(() => {
          localStorage.setItem(STORAGE_KEYS.sessionLibrary, JSON.stringify(sessionLibrary));
        }, [sessionLibrary]);
        React.useEffect(() => {
          localStorage.setItem(STORAGE_KEYS.roster, JSON.stringify(roster));
        }, [roster]);
        React.useEffect(() => {
          localStorage.setItem(STORAGE_KEYS.lineup, JSON.stringify(lineup));
        }, [lineup]);

        const handleChange = (event) => {
          const { name, value } = event.target;
          setSessionData((prev) => ({ ...prev, [name]: value }));
        };

        const toggleCollapse = (num) => {
          setCollapsed((prev) => ({ ...prev, [num]: !prev[num] }));
        };

        const copyActivity = (sourceNum, targetNum) => {
          setSessionData((prev) => ({
            ...prev,
            [`act${targetNum}Title`]: prev[`act${sourceNum}Title`] + ' (Copy)',
            [`act${targetNum}Duration`]: prev[`act${sourceNum}Duration`],
            [`act${targetNum}SetsReps`]: prev[`act${sourceNum}SetsReps`],
            [`act${targetNum}Explanation`]: prev[`act${sourceNum}Explanation`],
            [`act${targetNum}CoachingPoints`]: prev[`act${sourceNum}CoachingPoints`],
            [`act${targetNum}Progression`]: prev[`act${sourceNum}Progression`],
            [`act${targetNum}Canvas`]: cloneData(prev[`act${sourceNum}Canvas`])
          }));
          showToast(`Successfully copied Activity ${sourceNum} into Activity ${targetNum}!`);
        };

        const openSaveDrillModal = (num) => {
          setDrillSaveTargetActivity(String(num));
          setNewDrillTitle(sessionData[`act${num}Title`] || `Drill ${num}`);
          setNewDrillCategory('Rondo & Technical');
          setIsSaveDrillModalOpen(true);
        };

        const confirmSaveDrillToBank = () => {
          const num = drillSaveTargetActivity;
          const newDrill = {
            id: `drill_${Date.now()}`,
            title: newDrillTitle,
            category: newDrillCategory,
            explanation: sessionData[`act${num}Explanation`] || '',
            coachingPoints: sessionData[`act${num}CoachingPoints`] || '',
            canvas: cloneData(sessionData[`act${num}Canvas`] || { frames: [[]] })
          };
          setDrillBank((prev) => [...prev, newDrill]);
          setIsSaveDrillModalOpen(false);
          showToast(`Saved "${newDrill.title}" to your Drill Bank!`);
        };

        const loadDrillIntoActivity = (drill, targetNum) => {
          setSessionData((prev) => ({
            ...prev,
            [`act${targetNum}Title`]: drill.title,
            [`act${targetNum}Explanation`]: drill.explanation,
            [`act${targetNum}CoachingPoints`]: drill.coachingPoints,
            [`act${targetNum}Canvas`]: cloneData(drill.canvas || { frames: [[]] })
          }));
          setViewMode('session');
          showToast(`Loaded drill into Activity ${targetNum}!`);
        };

        const saveCurrentSessionToLibrary = () => {
          const sessionName = prompt('Enter a name for this session (e.g., Build-up Phase vs Low Block):', sessionData.team ? `${sessionData.team} - ${sessionData.date || 'Session'}` : 'Unnamed Session');
          if (!sessionName) return;

          const savedItem = {
            id: Date.now(),
            name: sessionName,
            savedAt: new Date().toLocaleDateString(),
            data: sessionData
          };

          setSessionLibrary((prev) => [...prev, savedItem]);
          showToast(`Successfully saved "${sessionName}" to Session Library!`);
        };

        const loadSessionFromLibrary = (libItem) => {
          setSessionData(libItem.data);
          setViewMode('session');
          showToast(`Loaded session "${libItem.name}"!`);
        };

        const deleteSessionFromLibrary = (id, event) => {
          event.stopPropagation();
          if (confirm('Are you sure you want to delete this saved session?')) {
            setSessionLibrary((prev) => prev.filter((item) => item.id !== id));
            showToast('Deleted session from library.');
          }
        };

        const applyTacticalTag = (num, tagText) => {
          const key = `act${num}CoachingPoints`;
          const current = sessionData[key];
          const updated = current ? `${current}\n• ${tagText}` : `• ${tagText}`;
          setSessionData((prev) => ({ ...prev, [key]: updated }));
          showToast(`Added tag: "${tagText}"`);
        };

        const handlePrint = () => {
          setIsPrinting(true);
          setCollapsed({ 1: false, 2: false, 3: false, 4: false });
          setTimeout(() => {
            window.print();
            setIsPrinting(false);
          }, 300);
        };

        const handlePdfDownload = () => {
          setIsPrinting(true);
          setCollapsed({ 1: false, 2: false, 3: false, 4: false });
          const element = document.getElementById('session-sheet-container');
          const options = {
            margin: 0.5,
            filename: `${sessionData.team || 'Training'}_Session_Plan.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
          };

          setTimeout(() => {
            html2pdf().from(element).set(options).save().then(() => {
              setIsPrinting(false);
              showToast('PDF Downloaded successfully!');
            });
          }, 400);
        };

        const filteredDrills = drillBank.filter((drill) => {
          const matchesCategory = selectedDrillCategory === 'All' || drill.category === selectedDrillCategory;
          const matchesSearch = drill.title.toLowerCase().includes(drillSearchQuery.toLowerCase()) || drill.explanation.toLowerCase().includes(drillSearchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });

        return (
          <div className="relative mx-auto max-w-6xl p-4 sm:p-6">
            {toast && (
              <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2 rounded-xl border border-emerald-500 bg-slate-900 px-4 py-3 text-xs font-bold text-white shadow-2xl animate-bounce">
                <span className="text-sm text-emerald-400">✔</span>
                {toast}
              </div>
            )}

            {fullscreenCanvas !== null && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 p-4">
                <div className="flex w-full max-w-4xl flex-col items-center rounded-xl border border-slate-700 bg-slate-900 p-4">
                  <div className="mb-3 flex w-full items-center justify-between">
                    <h3 className="text-sm font-bold text-white">Fullscreen Animated Pitch Editor — Activity {fullscreenCanvas}</h3>
                    <button type="button" onClick={() => setFullscreenCanvas(null)} className="rounded bg-red-600 px-3 py-1 text-xs font-bold text-white transition hover:bg-red-700">Close ✕</button>
                  </div>
                  <div className="flex w-full justify-center">
                    <div className="w-full max-w-[720px]">
                      <TacticalSketchpad
                        initialData={sessionData[`act${fullscreenCanvas}Canvas`]}
                        onSave={(data) => {
                          setSessionData((prev) => ({ ...prev, [`act${fullscreenCanvas}Canvas`]: data }));
                        }}
                        isPrinting={false}
                      />
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeDrillModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4">
                <div className="flex w-full max-w-lg flex-col gap-4 rounded-2xl border border-slate-300 bg-white p-6 shadow-2xl">
                  <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                    <div>
                      <span className="rounded-full bg-emerald-100 px-2 py-0.5 text-[10px] font-black uppercase tracking-wider text-emerald-700">{activeDrillModal.category || 'Custom Drill'}</span>
                      <h3 className="mt-1 text-lg font-black text-slate-900">{activeDrillModal.title}</h3>
                    </div>
                    <button type="button" onClick={() => setActiveDrillModal(null)} className="flex h-8 w-8 items-center justify-center rounded-full bg-slate-200 font-bold text-slate-800 transition hover:bg-slate-300">✕</button>
                  </div>

                  <div className="space-y-3 text-xs">
                    <div>
                      <strong className="mb-1 block text-[10px] font-bold uppercase tracking-wider text-slate-500">Organization / Explanation:</strong>
                      <p className="whitespace-pre-wrap rounded-lg border border-slate-200 bg-slate-50 p-3 font-medium text-slate-800">{activeDrillModal.explanation || 'No description provided.'}</p>
                    </div>
                    <div>
                      <strong className="mb-1 block text-[10px] font-bold uppercase tracking-wider text-slate-500">Coaching Points:</strong>
                      <p className="whitespace-pre-wrap rounded-lg border border-slate-200 bg-slate-50 p-3 font-medium text-slate-800">{activeDrillModal.coachingPoints || 'No coaching points provided.'}</p>
                    </div>
                  </div>

                  <div className="flex items-center justify-between border-t border-slate-200 pt-4">
                    <span className="text-[11px] font-bold text-slate-500">Load into active session:</span>
                    <div className="flex gap-1.5">
                      {[1, 2, 3, 4].map((num) => (
                        <button
                          key={num}
                          type="button"
                          onClick={() => {
                            loadDrillIntoActivity(activeDrillModal, num);
                            setActiveDrillModal(null);
                          }}
                          className="rounded bg-slate-900 px-2.5 py-1 text-xs font-bold text-white transition hover:bg-slate-800"
                        >
                          {num}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {isSaveDrillModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4">
                <div className="flex w-full max-w-md flex-col gap-4 rounded-2xl border border-slate-300 bg-white p-6 shadow-2xl">
                  <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                    <h3 className="text-base font-black text-slate-900">Save Drill to Library</h3>
                    <button type="button" onClick={() => setIsSaveDrillModalOpen(false)} className="flex h-8 w-8 items-center justify-center rounded-full bg-slate-200 font-bold text-slate-800 transition hover:bg-slate-300">✕</button>
                  </div>

                  <div className="space-y-3 text-xs">
                    <div>
                      <label className="mb-1 block font-bold text-slate-700">Drill Title</label>
                      <input value={newDrillTitle} onChange={(event) => setNewDrillTitle(event.target.value)} className="w-full rounded border border-slate-300 p-2 font-medium text-slate-800" />
                    </div>
                    <div>
                      <label className="mb-1 block font-bold text-slate-700">Category</label>
                      <select value={newDrillCategory} onChange={(event) => setNewDrillCategory(event.target.value)} className="w-full rounded border border-slate-300 p-2 font-medium text-slate-800">
                        {['Rondo & Technical', 'Build-up & Possession', 'Pressing & Defense', 'Attacking & Finishing'].map((category) => (
                          <option key={category} value={category}>{category}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setIsSaveDrillModalOpen(false)} className="rounded bg-slate-200 px-3 py-2 text-xs font-bold text-slate-800 transition hover:bg-slate-300">Cancel</button>
                    <button type="button" onClick={confirmSaveDrillToBank} className="rounded bg-emerald-600 px-3 py-2 text-xs font-bold text-white transition hover:bg-emerald-500">Save Drill</button>
                  </div>
                </div>
              </div>
            )}

            <div className="mb-6 flex flex-wrap items-center justify-between gap-4 rounded-2xl border-2 border-slate-900 bg-white p-5 shadow-xl">
              <div>
                <h1 className="text-2xl font-black uppercase tracking-tight sm:text-3xl">{sessionData.clubName || 'Coach Board'}</h1>
                <p className="text-[10px] font-black uppercase tracking-[0.28em] text-slate-500">Session planner · Match day coach board</p>
              </div>

              <nav className="flex flex-wrap gap-2 print:hidden">
                {['session', 'drills', 'library', 'roster'].map((tab) => (
                  <button
                    key={tab}
                    type="button"
                    onClick={() => setViewMode(tab)}
                    className={`rounded-lg px-3 py-2 text-[11px] font-bold uppercase tracking-[0.14em] transition ${viewMode === tab ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                  >
                    {tab === 'session' ? 'Session plan' : tab === 'drills' ? 'Drills' : tab === 'library' ? 'Library' : 'Roster'}
                  </button>
                ))}
                <button type="button" onClick={handlePrint} className="rounded-lg bg-blue-600 px-3 py-2 text-[11px] font-bold uppercase tracking-[0.14em] text-white hover:bg-blue-500">Print</button>
              </nav>
            </div>

            {viewMode === 'session' && (
              <div id="session-sheet-container" className="space-y-6">
                <div className="rounded-2xl border-2 border-slate-900 bg-white p-5 shadow-xl">
                  <div className="grid gap-3 sm:grid-cols-4">
                    <input name="clubName" value={sessionData.clubName} onChange={handleChange} className="rounded-lg border p-2 text-sm font-bold sm:col-span-2" placeholder="Club name" />
                    <input name="team" value={sessionData.team} onChange={handleChange} className="rounded-lg border p-2 text-sm" placeholder="Team" />
                    <input name="date" type="date" value={sessionData.date} onChange={handleChange} className="rounded-lg border p-2 text-sm" />
                  </div>

                  <div className="mt-4 grid gap-4 lg:grid-cols-2">
                    <label className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                      Club keys / session details
                      <textarea name="manageOneself" value={sessionData.manageOneself} onChange={handleChange} className="mt-2 min-h-[120px] w-full rounded-lg border p-2 text-sm" placeholder="Manage the ball / self / space..." />
                    </label>
                    <label className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                      Coaching priorities
                      <textarea name="manageTheBall" value={sessionData.manageTheBall} onChange={handleChange} className="mt-2 min-h-[120px] w-full rounded-lg border p-2 text-sm" placeholder="Primary technical and tactical priorities..." />
                    </label>
                  </div>
                </div>

                {[1, 2, 3, 4].map((num) => {
                  const isOpen = collapsed[num] !== false;
                  const titleKey = `act${num}Title`;
                  const durationKey = `act${num}Duration`;
                  const repsKey = `act${num}SetsReps`;
                  const explanationKey = `act${num}Explanation`;
                  const coachingKey = `act${num}CoachingPoints`;
                  const progressionKey = `act${num}Progression`;
                  const canvasKey = `act${num}Canvas`;

                  return (
                    <div key={num} className="rounded-2xl border-2 border-slate-900 bg-white p-5 shadow-xl">
                      <div className="mb-3 flex items-center justify-between gap-3">
                        <button type="button" onClick={() => toggleCollapse(num)} className="text-left text-lg font-black uppercase tracking-tight text-slate-900">
                          {sessionData[titleKey] || `Activity ${num}`}
                        </button>
                        <div className="flex flex-wrap items-center gap-2 print:hidden">
                          <button type="button" onClick={() => copyActivity(num, num === 4 ? 1 : num + 1)} className="rounded bg-slate-100 px-2 py-1 text-[10px] font-bold uppercase tracking-wide text-slate-700 hover:bg-slate-200">Copy</button>
                          <button type="button" onClick={() => openSaveDrillModal(num)} className="rounded bg-emerald-600 px-2 py-1 text-[10px] font-bold uppercase tracking-wide text-white hover:bg-emerald-500">Save drill</button>
                          <button type="button" onClick={() => setFullscreenCanvas(num)} className="rounded bg-indigo-600 px-2 py-1 text-[10px] font-bold uppercase tracking-wide text-white hover:bg-indigo-500">Canvas</button>
                        </div>
                      </div>

                      {isOpen && (
                        <div className="space-y-4">
                          <div className="grid gap-3 md:grid-cols-[1.5fr_120px_140px]">
                            <input name={titleKey} value={sessionData[titleKey]} onChange={handleChange} className="rounded border p-2 text-sm font-black" placeholder="Activity title" />
                            <input name={durationKey} value={sessionData[durationKey]} onChange={handleChange} className="rounded border p-2 text-sm" placeholder="Duration" />
                            <input name={repsKey} value={sessionData[repsKey]} onChange={handleChange} className="rounded border p-2 text-sm" placeholder="Sets / Reps" />
                          </div>

                          <div className="grid gap-4 lg:grid-cols-2">
                            <label className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                              Explanation / objective
                              <textarea name={explanationKey} value={sessionData[explanationKey]} onChange={handleChange} className="mt-2 min-h-[120px] w-full rounded border p-2 text-sm" />
                            </label>
                            <label className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                              Coaching points
                              <textarea name={coachingKey} value={sessionData[coachingKey]} onChange={handleChange} className="mt-2 min-h-[120px] w-full rounded border p-2 text-sm" />
                            </label>
                          </div>

                          <div className="grid gap-3 md:grid-cols-[1fr_auto]">
                            <label className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                              Progression
                              <textarea name={progressionKey} value={sessionData[progressionKey]} onChange={handleChange} className="mt-2 min-h-[100px] w-full rounded border p-2 text-sm" />
                            </label>
                            <div className="flex flex-wrap gap-2 self-end print:hidden">
                              {COMMON_TAGS.map((tag) => (
                                <button key={tag} type="button" onClick={() => applyTacticalTag(num, tag)} className="rounded bg-slate-100 px-2 py-1 text-[10px] font-bold uppercase tracking-wide text-slate-700 hover:bg-slate-200">{tag}</button>
                              ))}
                            </div>
                          </div>

                          <div className="rounded-xl border border-slate-200 bg-slate-50 p-3 print:bg-slate-50">
                            <div className="mb-2 text-[10px] font-black uppercase tracking-[0.22em] text-slate-500">Canvas snapshot</div>
                            <div className="overflow-hidden rounded-lg border border-slate-200 bg-slate-100">
                              <TacticalSketchpad
                                initialData={sessionData[canvasKey]}
                                onSave={(data) => setSessionData((prev) => ({ ...prev, [canvasKey]: data }))}
                                isPrinting={isPrinting}
                              />
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}

                <div className="rounded-2xl border-2 border-slate-900 bg-white p-5 shadow-xl">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <h2 className="text-xl font-black uppercase tracking-tight">Session microcycle</h2>
                    <button type="button" onClick={saveCurrentSessionToLibrary} className="rounded bg-emerald-600 px-3 py-2 text-[11px] font-bold uppercase tracking-[0.14em] text-white hover:bg-emerald-500">Save to library</button>
                  </div>
                  <div className="mt-4 grid gap-3 md:grid-cols-2 xl:grid-cols-3">
                    {microcycle.map((day, index) => (
                      <div key={`${day.day}-${index}`} className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                        <div className="text-[10px] font-black uppercase tracking-[0.22em] text-slate-500">{day.day}</div>
                        <input value={day.focus} onChange={(event) => {
                          const updated = [...microcycle];
                          updated[index].focus = event.target.value;
                          setMicrocycle(updated);
                        }} className="mt-2 w-full rounded border p-2 text-sm" />
                        <select value={day.load} onChange={(event) => {
                          const updated = [...microcycle];
                          updated[index].load = event.target.value;
                          setMicrocycle(updated);
                        }} className="mt-2 w-full rounded border p-2 text-sm">
                          {['Low', 'Moderate', 'High', 'Max', 'None'].map((level) => (
                            <option key={level} value={level}>{level}</option>
                          ))}
                        </select>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {viewMode === 'drills' && (
              <div className="space-y-6">
                <div className="rounded-2xl border-2 border-slate-900 bg-white p-5 shadow-xl">
                  <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
                    <h2 className="text-xl font-black uppercase tracking-tight">Drill bank</h2>
                    <div className="flex flex-wrap items-center gap-2">
                      <select value={selectedDrillCategory} onChange={(event) => setSelectedDrillCategory(event.target.value)} className="rounded border p-2 text-sm">
                        <option value="All">All categories</option>
                        {['Rondo & Technical', 'Build-up & Possession', 'Pressing & Defense', 'Attacking & Finishing'].map((category) => (
                          <option key={category} value={category}>{category}</option>
                        ))}
                      </select>
                      <input value={drillSearchQuery} onChange={(event) => setDrillSearchQuery(event.target.value)} className="rounded border p-2 text-sm" placeholder="Search drills" />
                    </div>
                  </div>

                  <div className="space-y-3">
                    {filteredDrills.map((drill) => (
                      <div key={drill.id} className="flex flex-col gap-3 rounded-xl border border-slate-200 bg-slate-50 p-3 sm:flex-row sm:items-center sm:justify-between">
                        <div>
                          <div className="text-sm font-black">{drill.title}</div>
                          <div className="text-[10px] font-black uppercase tracking-[0.16em] text-slate-500">{drill.category}</div>
                        </div>
                        <div className="flex flex-wrap gap-2">
                          <button type="button" onClick={() => setActiveDrillModal(drill)} className="rounded bg-slate-900 px-3 py-2 text-[11px] font-bold uppercase text-white hover:bg-slate-800">Preview</button>
                          {[1, 2, 3, 4].map((num) => (
                            <button key={num} type="button" onClick={() => loadDrillIntoActivity(drill, num)} className="rounded bg-slate-100 px-3 py-2 text-[11px] font-bold uppercase text-slate-700 hover:bg-slate-200">Load {num}</button>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {viewMode === 'library' && (
              <div className="space-y-6">
                <div className="rounded-2xl border-2 border-slate-900 bg-white p-5 shadow-xl">
                  <div className="mb-4 flex items-center justify-between gap-3">
                    <h2 className="text-xl font-black uppercase tracking-tight">Saved sessions</h2>
                    <button type="button" onClick={saveCurrentSessionToLibrary} className="rounded bg-emerald-600 px-3 py-2 text-[11px] font-bold uppercase tracking-[0.14em] text-white hover:bg-emerald-500">Save current</button>
                  </div>

                  {sessionLibrary.length === 0 ? (
                    <p className="text-sm italic text-slate-500">No saved sessions yet.</p>
                  ) : (
                    <div className="space-y-2">
                      {sessionLibrary.map((item) => (
                        <div key={item.id} className="flex flex-col gap-3 rounded-lg border border-slate-200 bg-slate-50 p-3 sm:flex-row sm:items-center sm:justify-between">
                          <div>
                            <div className="text-sm font-black">{item.name}</div>
                            <div className="text-[10px] font-black uppercase tracking-[0.16em] text-slate-500">{item.savedAt}</div>
                          </div>
                          <div className="flex gap-2">
                            <button type="button" onClick={() => loadSessionFromLibrary(item)} className="rounded bg-slate-900 px-3 py-2 text-[11px] font-bold uppercase text-white hover:bg-slate-800">Load</button>
                            <button type="button" onClick={(event) => deleteSessionFromLibrary(item.id, event)} className="rounded bg-red-900 px-3 py-2 text-[11px] font-bold uppercase text-red-100 hover:bg-red-800">Delete</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {viewMode === 'roster' && (
              <div className="space-y-6">
                <div className="rounded-2xl border-2 border-slate-900 bg-white p-5 shadow-xl">
                  <h2 className="mb-4 text-xl font-black uppercase tracking-tight">Roster & lineup</h2>

                  <div className="mb-4 grid gap-3 md:grid-cols-2">
                    <label className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                      Formation
                      <select value={lineup.formation} onChange={(event) => setLineup((prev) => ({ ...prev, formation: event.target.value }))} className="mt-2 w-full rounded border p-2 text-sm">
                        {['4-3-3', '4-4-2'].map((formation) => (
                          <option key={formation} value={formation}>{formation}</option>
                        ))}
                      </select>
                    </label>
                    <label className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                      Notes
                      <input value={lineup.notes} onChange={(event) => setLineup((prev) => ({ ...prev, notes: event.target.value }))} className="mt-2 w-full rounded border p-2 text-sm" placeholder="Lineup notes" />
                    </label>
                  </div>

                  <div className="grid gap-3 md:grid-cols-2">
                    {roster.map((player) => (
                      <div key={player.id} className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                        <div className="mb-2 flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <div className="flex h-7 w-7 items-center justify-center rounded-full bg-slate-900 text-[10px] font-black text-white">{player.number}</div>
                            <div>
                              <div className="text-sm font-black">{player.name}</div>
                              <div className="text-[10px] uppercase tracking-wide text-slate-500">{player.position}</div>
                            </div>
                          </div>
                          <select value={player.status} onChange={(event) => {
                            const updated = [...roster];
                            updated[player.id - 1].status = event.target.value;
                            setRoster(updated);
                          }} className="rounded border p-1 text-[10px] font-bold uppercase">
                            {['Available', 'Available', 'Doubt', 'Out', 'Rested'].map((status) => (
                              <option key={status} value={status}>{status}</option>
                            ))}
                          </select>
                        </div>
                        <textarea value={player.kpiNotes} onChange={(event) => {
                          const updated = [...roster];
                          updated[player.id - 1].kpiNotes = event.target.value;
                          setRoster(updated);
                        }} className="min-h-[70px] w-full rounded border p-2 text-xs" />
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            <footer className="mt-6 flex flex-wrap justify-between gap-3 text-[10px] font-bold uppercase tracking-[0.18em] text-slate-500 print:hidden">
              <span>Local autosave enabled</span>
              <span>Print / PDF from your browser</span>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
