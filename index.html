<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Session Planner & Club Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print { .print\:hidden { display:none!important } body { background:#fff!important } }
    * { box-sizing:border-box }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">
<div id="root"></div>
<script type="text/babel">
const {useEffect,useRef,useState}=React;
const STORAGE='pro_soccer_planner_v20';
const zoneSets={
  traditional:[
    {id:'defensive',label:'Defensive third',short:'DEFENSIVE THIRD',x:0,y:0,w:33.333,h:100,color:'#2563eb'},
    {id:'middle',label:'Middle third',short:'MIDDLE THIRD',x:33.333,y:0,w:33.334,h:100,color:'#16a34a'},
    {id:'attacking',label:'Attacking third',short:'ATTACKING THIRD',x:66.667,y:0,w:33.333,h:100,color:'#dc2626'}
  ],
  halfspaces:[
    {id:'left-wide',label:'Left wide channel',short:'LEFT WIDE',x:0,y:0,w:16.667,h:100,color:'#0ea5e9'},
    {id:'left-half',label:'Left half-space',short:'LEFT HALF-SPACE',x:16.667,y:0,w:16.667,h:100,color:'#8b5cf6'},
    {id:'central',label:'Central lane',short:'CENTRAL',x:33.333,y:0,w:33.334,h:100,color:'#16a34a'},
    {id:'right-half',label:'Right half-space',short:'RIGHT HALF-SPACE',x:66.667,y:0,w:16.667,h:100,color:'#8b5cf6'},
    {id:'right-wide',label:'Right wide channel',short:'RIGHT WIDE',x:83.333,y:0,w:16.667,h:100,color:'#0ea5e9'}
  ]
};
function Field({zoneMode,setZoneMode}){
  const canvas=useRef(null), [tool,setTool]=useState('select'), [objects,setObjects]=useState([]), [drawing,setDrawing]=useState(null), [selected,setSelected]=useState(null), [color,setColor]=useState('#facc15');
  const zones=zoneSets[zoneMode];
  const point=e=>{const r=canvas.current.getBoundingClientRect();return {x:(e.clientX-r.left)*560/r.width,y:(e.clientY-r.top)*320/r.height}};
  const redraw=()=>{const c=canvas.current;if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,560,320);x.fillStyle='#166534';x.fillRect(0,0,560,320);
    x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=2;x.strokeRect(8,8,544,304);x.beginPath();x.moveTo(280,8);x.lineTo(280,312);x.stroke();x.beginPath();x.arc(280,160,45,0,Math.PI*2);x.stroke();
    x.strokeRect(8,105,72,110);x.strokeRect(480,105,72,110);x.strokeRect(8,135,25,50);x.strokeRect(527,135,25,50);
    objects.forEach((o,i)=>{x.save();x.strokeStyle=i===selected?'#fff':o.color||color;x.fillStyle=o.color||color;x.lineWidth=i===selected?4:3;x.lineCap='round';
      if(o.type==='line'||o.type==='run'||o.type==='pass'){x.setLineDash(o.type==='pass'?[8,5]:o.type==='run'?[3,5]:[]);x.beginPath();x.moveTo(o.sx,o.sy);x.lineTo(o.ex,o.ey);x.stroke();x.setLineDash([]);const a=Math.atan2(o.ey-o.sy,o.ex-o.sx);x.beginPath();x.moveTo(o.ex,o.ey);x.lineTo(o.ex-10*Math.cos(a-.5),o.ey-10*Math.sin(a-.5));x.lineTo(o.ex-10*Math.cos(a+.5),o.ey-10*Math.sin(a+.5));x.closePath();x.fill();}
      else if(o.type==='freehand'){x.beginPath();o.points.forEach((p,j)=>j?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();}
      else {x.beginPath();x.arc(o.x,o.y,o.type==='cone'?7:11,0,Math.PI*2);x.fill();if(o.type==='player'){x.fillStyle='#111827';x.font='bold 10px sans-serif';x.textAlign='center';x.fillText(o.label||'',o.x,o.y+4)}} x.restore()});
  };
  useEffect(redraw,[objects,selected,color]);
  const down=e=>{if(tool==='select'||tool==='erase'){const p=point(e);const idx=objects.findIndex(o=>Math.hypot((o.x??o.sx)-p.x,(o.y??o.sy)-p.y)<18);if(tool==='erase'&&idx>=0)setObjects(a=>a.filter((_,i)=>i!==idx));else setSelected(idx<0?null:idx);return}const p=point(e);if(tool==='freehand'){setDrawing({type:'freehand',points:[p],color});return}if(['pass','run','line'].includes(tool)){setDrawing({type:tool,sx:p.x,sy:p.y,ex:p.x,ey:p.y,color});return}setObjects(a=>[...a,{type:tool,x:p.x,y:p.y,color,label:tool==='player'?prompt('Player number or label:')||'':undefined}]);};
  const move=e=>{if(!drawing)return;const p=point(e);setDrawing(d=>d.type==='freehand'?{...d,points:[...d.points,p]}:{...d,ex:p.x,ey:p.y})};
  const up=()=>{if(drawing){setObjects(a=>[...a,drawing]);setDrawing(null)}};
  useEffect(()=>{const c=canvas.current;if(!c)return;c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);window.addEventListener('pointerup',up);return()=>{c.removeEventListener('pointerdown',down);c.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)}},[tool,drawing,objects,color]);
  const shown=[...objects,...(drawing?[drawing]:[])];
  return <div className="bg-slate-900 rounded-2xl p-3 text-white shadow-xl">
    <div className="flex flex-wrap gap-2 mb-3 print:hidden"><select value={zoneMode} onChange={e=>setZoneMode(e.target.value)} className="bg-slate-700 rounded px-2 py-2 text-xs font-bold"><option value="traditional">Traditional thirds</option><option value="halfspaces">Half spaces</option></select>{[['select','Select'],['player','Player'],['cone','Cone'],['pass','Pass'],['run','Run'],['line','Line'],['freehand','Hand-drawn scan'],['erase','Erase']].map(([id,label])=><button type="button" key={id} onClick={()=>setTool(id)} className={`px-2.5 py-2 rounded text-xs font-bold ${tool===id?'bg-yellow-400 text-slate-900':'bg-slate-700 hover:bg-slate-600'}`}>{label}</button>)}<input aria-label="drawing colour" type="color" value={color} onChange={e=>setColor(e.target.value)} className="h-8 w-9"/><button type="button" onClick={()=>setObjects([])} className="px-2.5 py-2 rounded bg-red-700 text-xs font-bold">Clear</button></div>
    <div className="relative overflow-hidden rounded-xl bg-green-800"><div className="absolute inset-0 grid pointer-events-none">{zones.map(z=><div key={z.id} style={{position:'absolute',left:z.x+'%',top:z.y+'%',width:z.w+'%',height:z.h+'%',background:z.color,opacity:.13,borderRight:'1px solid rgba(255,255,255,.45)'}}><span className="flex h-full items-center justify-center text-[9px] font-black tracking-wide text-white/70 [writing-mode:vertical-rl] sm:[writing-mode:horizontal-tb]">{z.short}</span></div>)}</div><canvas ref={canvas} width="560" height="320" className="relative block w-full touch-none cursor-crosshair"/></div>
    <div className="mt-2 flex items-center justify-between text-[11px] text-slate-300"><span>{tool==='freehand'?'Draw directly on the field to scan or annotate a movement.':'Select a zone view, then add players, movements, or annotations.'}</span><span>{shown.length} marks</span></div>
  </div>
}
function App(){const [data,setData]=useState(()=>{try{return JSON.parse(localStorage.getItem(STORAGE))||{}}catch{return {}}});const [tab,setTab]=useState('session');const [zoneMode,setZoneMode]=useState(data.zoneMode||'traditional');const [toast,setToast]=useState('');const [session,setSession]=useState(data.session||{clubName:'ACADEMY & CLUB DEVELOPMENT SUITE',team:'',date:'',focus:'',activities:[{title:'Activity 1',explanation:''},{title:'Activity 2',explanation:''},{title:'Activity 3',explanation:''}]});useEffect(()=>{localStorage.setItem(STORAGE,JSON.stringify({...data,zoneMode,session}))},[data,zoneMode,session]);const notify=m=>{setToast(m);setTimeout(()=>setToast(''),1800)};const update=(k,v)=>setSession(s=>({...s,[k]:v}));return <main className="max-w-6xl mx-auto p-4 sm:p-6"><header className="bg-white rounded-2xl border shadow-md p-5 mb-5 flex flex-wrap items-center justify-between gap-4"><div><h1 className="text-2xl font-black uppercase">{session.clubName}</h1><p className="text-xs font-bold text-slate-500">PRO SESSION PLANNER & CLUB SUITE</p></div><nav className="flex flex-wrap gap-2 print:hidden">{[['session','Session'],['zones','Field zones']].map(([id,label])=><button key={id} onClick={()=>setTab(id)} className={`rounded-lg px-3 py-2 text-xs font-bold ${tab===id?'bg-slate-900 text-white':'bg-slate-100 hover:bg-slate-200'}`}>{label}</button>)}<button onClick={()=>window.print()} className="rounded-lg bg-blue-600 px-3 py-2 text-xs font-bold text-white">Print</button></nav></header>{toast&&<div className="fixed right-4 top-4 z-50 rounded-lg bg-emerald-600 px-4 py-3 text-sm font-bold text-white shadow-lg">{toast}</div>}{tab==='session'?<section className="bg-white rounded-2xl border-2 border-slate-900 p-5 sm:p-8"><div className="grid gap-3 sm:grid-cols-4 mb-6"><input value={session.clubName} onChange={e=>update('clubName',e.target.value)} className="rounded border p-2 font-bold sm:col-span-2" placeholder="Club name"/><input value={session.team} onChange={e=>update('team',e.target.value)} className="rounded border p-2" placeholder="Team"/><input type="date" value={session.date} onChange={e=>update('date',e.target.value)} className="rounded border p-2"/></div><label className="mb-2 block text-xs font-black uppercase">Session focus</label><textarea value={session.focus} onChange={e=>update('focus',e.target.value)} className="mb-6 min-h-20 w-full rounded border p-3" placeholder="Key tactical objective..."/><h2 className="mb-3 text-xl font-black uppercase">Tactical board</h2><Field zoneMode={zoneMode} setZoneMode={setZoneMode}/><div className="mt-6 grid gap-4 sm:grid-cols-3">{session.activities.map((a,i)=><div key={i} className="rounded-xl border p-4"><input value={a.title} onChange={e=>setSession(s=>({...s,activities:s.activities.map((x,n)=>n===i?{...x,title:e.target.value}:x)}))} className="mb-2 w-full rounded border p-2 font-bold"/><textarea value={a.explanation} onChange={e=>setSession(s=>({...s,activities:s.activities.map((x,n)=>n===i?{...x,explanation:e.target.value}:x)}))} className="min-h-24 w-full rounded border p-2 text-sm" placeholder="Activity details..."/></div>)}</div><button onClick={()=>notify('Session saved locally')} className="mt-6 rounded-lg bg-emerald-600 px-4 py-3 text-sm font-bold text-white">Save session</button></section>:<section className="bg-white rounded-2xl border-2 border-slate-900 p-5 sm:p-8"><h2 className="mb-2 text-xl font-black uppercase">Traditional zones & half spaces</h2><p className="mb-5 text-sm text-slate-600">Use the selector to compare the three traditional thirds with the five-lane half-space model. The hand-drawn scan tool is available on both views.</p><Field zoneMode={zoneMode} setZoneMode={setZoneMode}/><div className="mt-5 grid gap-3 sm:grid-cols-2">{zoneSets[zoneMode].map(z=><div key={z.id} className="rounded-lg border-l-4 p-3" style={{borderColor:z.color}}><b>{z.label}</b><p className="text-xs text-slate-500">Tactical reference zone for planning and annotation.</p></div>)}</div></section>}</main>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
