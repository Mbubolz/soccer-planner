<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach Board | Session Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print {
      body { background:#fff !important; color:#0f172a !important; }
      .print\:hidden,.no-print { display:none !important; }
      .print\:shadow-none { box-shadow:none !important; }
      .print\:border-none { border:none !important; }
      .print\:break-inside-avoid { break-inside:avoid; }
      .print-board { display:block !important; }
    }
    * { box-sizing:border-box; }
    body { margin:0; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">
<div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useRef,useState}=React;
const STORAGE='pro_coach_board_v22';
const clone=v=>JSON.parse(JSON.stringify(v));
const ZONES={
  thirds:[
    {id:'def',label:'Defensive third',short:'DEFENSIVE',x:0,w:33.333,color:'#2563eb'},
    {id:'mid',label:'Middle third',short:'MIDDLE',x:33.333,w:33.334,color:'#16a34a'},
    {id:'att',label:'Attacking third',short:'ATTACKING',x:66.667,w:33.333,color:'#dc2626'}
  ],
  lanes:[
    {id:'lw',label:'Left wide channel',short:'LEFT WIDE',x:0,w:16.667,color:'#0ea5e9'},
    {id:'lh',label:'Left half-space',short:'LEFT HALF',x:16.667,w:16.667,color:'#8b5cf6'},
    {id:'c',label:'Central lane',short:'CENTRAL',x:33.333,w:33.334,color:'#16a34a'},
    {id:'rh',label:'Right half-space',short:'RIGHT HALF',x:66.667,w:16.667,color:'#8b5cf6'},
    {id:'rw',label:'Right wide channel',short:'RIGHT WIDE',x:83.333,w:16.667,color:'#0ea5e9'}
  ]
};
const FORMATIONS={
  '4-3-3':[['GK',8,50],['RB',24,18],['RCB',20,38],['LCB',20,62],['LB',24,82],['6',43,50],['8',48,27],['10',48,73],['RW',70,18],['9',78,50],['LW',70,82]],
  '4-2-3-1':[['GK',8,50],['RB',24,18],['RCB',20,38],['LCB',20,62],['LB',24,82],['6',40,38],['8',40,62],['RW',61,18],['10',57,50],['LW',61,82],['9',79,50]],
  '3-4-3':[['GK',8,50],['RCB',20,30],['CB',20,50],['LCB',20,70],['RWB',43,12],['6',42,39],['8',42,61],['LWB',43,88],['RW',68,20],['9',80,50],['LW',68,80]]
};
const DEFAULT_SESSION={
  title:'Match Day / Training Session',club:'ACADEMY & CLUB DEVELOPMENT SUITE',team:'',date:'',opponent:'',venue:'',kickoff:'',formation:'4-3-3',zoneMode:'lanes',focus:'Build through the half-spaces and press immediately after loss.',objectives:'',coachNotes:'',matchPlan:'',tags:['Half-space access','Pressing triggers','Width & depth'],checks:{build:false,press:false,rest:false,transitions:false,standards:false},marks:[],activities:[
    {title:'Activation & Rondo',duration:'15 min',objective:'Receive side-on; scan before the ball arrives.',detail:''},
    {title:'Build-up / Positional Play',duration:'25 min',objective:'Create a free player in the half-space.',detail:''},
    {title:'Pressing & Transition Game',duration:'25 min',objective:'Win the ball back within six seconds.',detail:''},
    {title:'Conditioned Match',duration:'25 min',objective:'Transfer the theme into realistic decisions.',detail:''}
  ]
};
const TEMPLATES=[
  {name:'Match day 4-3-3',patch:{title:'Match Day Plan',formation:'4-3-3',zoneMode:'lanes',focus:'Control the central lane, access both half-spaces, and counter-press on loss.',objectives:'In possession: create width, find the 8/10 between lines, attack the box with five.\nOut of possession: lock the ball-side half-space and force play wide.',matchPlan:'First 15 minutes: secure the ball and test the opponent fullback.\nIf leading: protect the central lane and counter through the wide channel.\nIf chasing: add a second striker and attack the far post.'}},
  {name:'High press session',patch:{title:'High Pressing Principles',formation:'4-2-3-1',zoneMode:'thirds',focus:'Press on poor body shape, backward passes, and passes into the touchline.',objectives:'Trigger: backwards pass or bouncing ball.\nCover shadow: screen the 6.\nSecond action: recover compactly if the first press is broken.',matchPlan:'Use the near-side winger to lock the fullback and the 10 to screen the pivot.'}},
  {name:'Build-up session',patch:{title:'Build Through Half-Spaces',formation:'3-4-3',zoneMode:'lanes',focus:'Disorganise the first line, attract pressure, then penetrate the half-space.',objectives:'GK + back three create the first line.\nMidfielders rotate to open the central lane.\nWingbacks provide maximum width.',matchPlan:'Progress with the third player; avoid forcing the first forward pass.'}}
];
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||{}}catch{return {}}}
function Btn({children,onClick,active=false,tone='slate',className=''}){return <button type="button" onClick={onClick} className={`rounded-lg px-3 py-2 text-xs font-bold transition ${active?`bg-${tone}-600 text-white`:'bg-slate-100 text-slate-700 hover:bg-slate-200'} ${className}`}>{children}</button>}
function Panel({title,subtitle,children,className=''}){return <section className={`rounded-2xl border-2 border-slate-900 bg-white p-5 shadow-xl sm:p-7 ${className}`}><h2 className="mb-1 text-xl font-black uppercase tracking-tight">{title}</h2>{subtitle&&<p className="mb-4 text-[10px] font-black uppercase tracking-[.22em] text-slate-500">{subtitle}</p>}{children}</section>}
function Checklist({session,setSession}){const items=[['build','Build-up / possession'],['press','Pressing triggers'],['rest','Rest defence'],['transitions','Transition reactions'],['standards','Set pieces / restarts']];return <div className="space-y-2">{items.map(([id,label])=><label key={id} className="flex cursor-pointer items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 p-2 text-xs font-bold"><input type="checkbox" checked={!!session.checks[id]} onChange={e=>setSession(s=>({...s,checks:{...s.checks,[id]:e.target.checked}}))} className="h-4 w-4 accent-emerald-600"/>{label}</label>)}</div>}
function Board({session,setSession}){
  const ref=useRef(null),[tool,setTool]=useState('select'),[color,setColor]=useState('#facc15'),[drawing,setDrawing]=useState(null),[selected,setSelected]=useState(-1);
  const zones=ZONES[session.zoneMode==='thirds'?'thirds':'lanes'];
  const p=e=>{const r=ref.current.getBoundingClientRect();return{x:(e.clientX-r.left)*560/r.width,y:(e.clientY-r.top)*320/r.height}};
  const nearest=q=>{let ix=-1,d=22;(session.marks||[]).forEach((o,i)=>{const x=o.x??o.sx,y=o.y??o.sy,dd=Math.hypot(x-q.x,y-q.y);if(dd<d){d=dd;ix=i}});return ix};
  const add=o=>setSession(s=>({...s,marks:[...(s.marks||[]),o]}));
  const down=e=>{const q=p(e);if(tool==='erase'){const i=nearest(q);if(i>=0)setSession(s=>({...s,marks:s.marks.filter((_,n)=>n!==i)}));return}if(tool==='select'){setSelected(nearest(q));return}if(tool==='player'){add({type:'player',x:q.x,y:q.y,label:prompt('Player number or label','7')||'7',color});return}if(['ball','cone','marker'].includes(tool)){add({type:tool,x:q.x,y:q.y,color});return}if(tool==='freehand'){setDrawing({type:'freehand',points:[q],color});return}if(['pass','run','line'].includes(tool))setDrawing({type:tool,sx:q.x,sy:q.y,ex:q.x,ey:q.y,color})};
  const move=e=>{if(!drawing)return;const q=p(e);setDrawing(d=>d.type==='freehand'?({...d,points:[...d.points,q]}):({...d,ex:q.x,ey:q.y}))};
  const up=()=>{if(drawing){add(drawing);setDrawing(null)}};
  useEffect(()=>{const c=ref.current;if(!c)return;c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);window.addEventListener('pointerup',up);return()=>{c.removeEventListener('pointerdown',down);c.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)}},[tool,drawing,session.marks,color]);
  useEffect(()=>{const c=ref.current;if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,560,320);x.fillStyle='#166534';x.fillRect(0,0,560,320);x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;x.strokeRect(8,8,544,304);x.beginPath();x.moveTo(280,8);x.lineTo(280,312);x.stroke();x.beginPath();x.arc(280,160,45,0,Math.PI*2);x.stroke();x.strokeRect(8,105,72,110);x.strokeRect(480,105,72,110);x.strokeRect(8,135,25,50);x.strokeRect(527,135,25,50);
    const marks=[...(session.marks||[]),...(drawing?[drawing]:[])];marks.forEach((o,i)=>{x.save();x.strokeStyle=i===selected?'#fff':o.color||'#fff';x.fillStyle=o.color||'#fff';x.lineWidth=i===selected?5:3;x.lineCap='round';if(['pass','run','line'].includes(o.type)){x.setLineDash(o.type==='pass'?[8,5]:o.type==='run'?[3,5]:[]);x.beginPath();x.moveTo(o.sx,o.sy);x.lineTo(o.ex,o.ey);x.stroke();x.setLineDash([]);const a=Math.atan2(o.ey-o.sy,o.ex-o.sx);x.beginPath();x.moveTo(o.ex,o.ey);x.lineTo(o.ex-10*Math.cos(a-.5),o.ey-10*Math.sin(a-.5));x.lineTo(o.ex-10*Math.cos(a+.5),o.ey-10*Math.sin(a+.5));x.closePath();x.fill()}else if(o.type==='freehand'){x.beginPath();o.points.forEach((z,n)=>n?x.lineTo(z.x,z.y):x.moveTo(z.x,z.y));x.stroke()}else if(o.type==='player'){x.beginPath();x.arc(o.x,o.y,11,0,Math.PI*2);x.fill();x.fillStyle='#111827';x.font='bold 10px sans-serif';x.textAlign='center';x.fillText(o.label,o.x,o.y+4)}else if(o.type==='cone'){x.beginPath();x.moveTo(o.x,o.y-9);x.lineTo(o.x-8,o.y+8);x.lineTo(o.x+8,o.y+8);x.closePath();x.fill()}else{x.beginPath();x.arc(o.x,o.y,o.type==='ball'?6:8,0,Math.PI*2);x.fill()}x.restore()})},[session.marks,drawing,selected,session.zoneMode]);
  const tools=[['select','Select'],['player','Player'],['ball','Ball'],['cone','Cone'],['marker','Marker'],['pass','Pass'],['run','Run'],['line','Line'],['freehand','Hand scan'],['erase','Erase']];
  return <div className="rounded-2xl bg-slate-900 p-3 text-white shadow-xl"><div className="mb-3 flex flex-wrap gap-2 print:hidden"><select value={session.zoneMode} onChange={e=>setSession(s=>({...s,zoneMode:e.target.value}))} className="rounded bg-slate-700 px-2 py-2 text-xs font-bold"><option value="lanes">Half-space lanes</option><option value="thirds">Traditional thirds</option></select>{tools.map(([id,label])=><Btn key={id} onClick={()=>setTool(id)} active={tool===id} className={tool===id?'bg-yellow-400 text-slate-900':''}>{label}</Btn>)}<input type="color" value={color} onChange={e=>setColor(e.target.value)} className="h-8 w-9"/><Btn onClick={()=>setSession(s=>({...s,marks:[]}))} className="bg-red-700 text-white hover:bg-red-600">Clear</Btn></div><div className="relative overflow-hidden rounded-xl bg-green-800"><div className="pointer-events-none absolute inset-0">{zones.map(z=><div key={z.id} style={{position:'absolute',left:`${z.x}%`,width:`${z.w}%`,top:0,height:'100%',background:z.color,opacity:.14,borderRight:'1px solid rgba(255,255,255,.4)'}}><div className="flex h-full items-center justify-center text-[8px] font-black tracking-widest text-white/70">{z.short}</div></div>)}</div><canvas ref={ref} width="560" height="320" className="relative block h-auto w-full touch-none cursor-crosshair"/></div><div className="mt-2 flex justify-between text-[10px] text-slate-300"><span>{tool==='freehand'?'Draw your scan directly on the pitch.':'Add formation players, actions, and coaching detail.'}</span><span>{(session.marks||[]).length} marks</span></div></div>
}
function Formation({session,setSession}){const positions=FORMATIONS[session.formation]||FORMATIONS['4-3-3'];return <div className="relative aspect-[1.65] overflow-hidden rounded-xl border-2 border-white/60 bg-green-800 shadow-inner"><div className="absolute inset-2 border-2 border-white/70"><div className="absolute inset-y-0 left-1/2 border-l-2 border-white/70"/><div className="absolute left-1/2 top-1/2 h-1/4 w-[14%] -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white/70"/><div className="absolute left-0 top-1/4 h-1/2 w-[13%] border-2 border-white/70"/><div className="absolute right-0 top-1/4 h-1/2 w-[13%] border-2 border-white/70"/>{positions.map(([label,x,y])=><div key={label} className="absolute -translate-x-1/2 -translate-y-1/2" style={{left:`${x}%`,top:`${y}%`}}><div className="flex h-7 w-7 items-center justify-center rounded-full border-2 border-white bg-red-600 text-[9px] font-black shadow">{label}</div></div>)}</div></div>}
function App(){const saved=load();const [session,setSession]=useState(saved.session||DEFAULT_SESSION);const [templates,setTemplates]=useState(saved.templates||[]);const [view,setView]=useState('board');const [toast,setToast]=useState('');useEffect(()=>localStorage.setItem(STORAGE,JSON.stringify({session,templates})),[session,templates]);useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),1800);return()=>clearTimeout(t)},[toast]);const update=(k,v)=>setSession(s=>({...s,[k]:v}));const activity=(i,k,v)=>setSession(s=>({...s,activities:s.activities.map((a,n)=>n===i?{...a,[k]:v}:a)}));const applyTemplate=t=>{setSession(s=>({...s,...clone(t.patch),checks:{...s.checks},marks:[]}));setToast(`${t.name} loaded`)};const saveTemplate=()=>{const name=prompt('Template name','My coach template');if(name)setTemplates(x=>[...x,{name,patch:clone(session)}]);setToast('Template saved')};const reset=()=>{if(confirm('Reset this session?'))setSession(clone(DEFAULT_SESSION))};return <main className="mx-auto max-w-7xl p-4 sm:p-6"><header className="mb-6 flex flex-wrap items-center justify-between gap-4 rounded-2xl border-2 border-slate-900 bg-white p-5 shadow-xl"><div><h1 className="text-2xl font-black uppercase tracking-tight sm:text-3xl">{session.club||'Coach Board'}</h1><p className="text-[10px] font-black uppercase tracking-[.28em] text-slate-500">Session planner · Match day coach board</p></div><nav className="flex flex-wrap gap-2 print:hidden">{[['board','Coach board'],['session','Session plan'],['match','Match day'],['templates','Templates']].map(([id,label])=><Btn key={id} onClick={()=>setView(id)} active={view===id}>{label}</Btn>)}<Btn onClick={()=>window.print()} className="bg-blue-600 text-white hover:bg-blue-500">Print / PDF</Btn></nav></header>{toast&&<div className="fixed right-4 top-4 z-50 rounded-lg bg-emerald-600 px-4 py-3 text-sm font-bold text-white shadow-xl">{toast}</div>}
{view==='board'&&<div className="grid gap-6 lg:grid-cols-[1fr_320px]"><Panel title="Tactical board" subtitle="Plan · explain · communicate"><Board session={session} setSession={setSession}/><div className="mt-4 grid gap-3 sm:grid-cols-3"><div className="rounded-xl bg-slate-50 p-3"><b className="text-xs uppercase">Theme</b><p className="mt-1 text-sm">{session.focus}</p></div><div className="rounded-xl bg-slate-50 p-3"><b className="text-xs uppercase">Formation</b><p className="mt-1 text-sm">{session.formation}</p></div><div className="rounded-xl bg-slate-50 p-3"><b className="text-xs uppercase">Opponent</b><p className="mt-1 text-sm">{session.opponent||'Not set'}</p></div></div></Panel><div className="space-y-6"><Panel title="Match checklist" subtitle="Before / during / after"><Checklist session={session} setSession={setSession}/></Panel><Panel title="Coach cues" subtitle="Quick reference"><ul className="space-y-2 text-xs font-semibold text-slate-700"><li>• Scan before receiving.</li><li>• Fix the opponent with width.</li><li>• Find the free player in the half-space.</li><li>• Counter-press the first five seconds.</li><li>• Protect the central lane behind the ball.</li></ul></Panel></div></div>}
{view==='session'&&<div className="space-y-6"><Panel title="Session plan" subtitle="Training detail and objective template"><div className="grid gap-3 sm:grid-cols-4"><input value={session.title} onChange={e=>update('title',e.target.value)} className="rounded-lg border p-2 text-sm font-bold sm:col-span-2" placeholder="Session title"/><input value={session.team} onChange={e=>update('team',e.target.value)} className="rounded-lg border p-2 text-sm" placeholder="Team"/><input type="date" value={session.date} onChange={e=>update('date',e.target.value)} className="rounded-lg border p-2 text-sm"/></div><div className="mt-4 grid gap-4 lg:grid-cols-2"><label className="text-xs font-black uppercase">Tactical focus<textarea value={session.focus} onChange={e=>update('focus',e.target.value)} className="mt-1 min-h-24 w-full rounded-lg border p-2 text-sm"/></label><label className="text-xs font-black uppercase">Objective template<textarea value={session.objectives} onChange={e=>update('objectives',e.target.value)} placeholder="In possession... Out of possession... Transition... Set pieces..." className="mt-1 min-h-24 w-full rounded-lg border p-2 text-sm"/></label></div></Panel><Panel title="Training blocks" subtitle="Objective · duration · coaching detail"><div className="grid gap-4 lg:grid-cols-2">{session.activities.map((a,i)=><div key={i} className="rounded-xl border bg-slate-50 p-4"><div className="grid gap-2 sm:grid-cols-[1fr_100px]"><input value={a.title} onChange={e=>activity(i,'title',e.target.value)} className="rounded border p-2 text-sm font-black"/><input value={a.duration} onChange={e=>activity(i,'duration',e.target.value)} className="rounded border p-2 text-sm"/></div><input value={a.objective} onChange={e=>activity(i,'objective',e.target.value)} className="mt-2 w-full rounded border p-2 text-sm" placeholder="Tactical objective"/><textarea value={a.detail} onChange={e=>activity(i,'detail',e.target.value)} className="mt-2 min-h-24 w-full rounded border p-2 text-sm" placeholder="Organisation, conditions, coaching points, progression..."/></div>)}</div><button type="button" onClick={()=>setSession(s=>({...s,activities:[...s.activities,{title:`Activity ${s.activities.length+1}`,duration:'',objective:'',detail:''}]}))} className="mt-4 rounded-lg bg-slate-900 px-4 py-2 text-sm font-bold text-white">Add activity</button></Panel></div>}
{view==='match'&&<div className="grid gap-6 lg:grid-cols-[1fr_360px]"><Panel title="Match day board" subtitle="Starting structure and match plan"><div className="mb-4 grid gap-3 sm:grid-cols-3"><input value={session.opponent} onChange={e=>update('opponent',e.target.value)} className="rounded border p-2 text-sm" placeholder="Opponent"/><input value={session.venue} onChange={e=>update('venue',e.target.value)} className="rounded border p-2 text-sm" placeholder="Venue"/><input value={session.kickoff} onChange={e=>update('kickoff',e.target.value)} className="rounded border p-2 text-sm" placeholder="Kick-off"/></div><div className="mb-4 flex items-center gap-3"><label className="text-xs font-black uppercase">Formation<select value={session.formation} onChange={e=>update('formation',e.target.value)} className="ml-2 rounded border p-2 text-sm">{Object.keys(FORMATIONS).map(f=><option key={f}>{f}</option>)}</select></label></div><Formation session={session} setSession={setSession}/></Panel><div className="space-y-6"><Panel title="Match plan" subtitle="Scenario notes"><textarea value={session.matchPlan} onChange={e=>update('matchPlan',e.target.value)} className="min-h-52 w-full rounded-lg border p-3 text-sm" placeholder="First 15 minutes... If leading... If chasing... Substitutions..."/></Panel><Panel title="Match checklist"><Checklist session={session} setSession={setSession}/></Panel></div></div>}
{view==='templates'&&<div className="grid gap-6 lg:grid-cols-2"><Panel title="Built-in templates" subtitle="Start quickly"><div className="space-y-3">{TEMPLATES.map(t=><div key={t.name} className="flex items-center justify-between rounded-xl border bg-slate-50 p-3"><div><b className="text-sm">{t.name}</b><p className="text-xs text-slate-500">{t.patch.formation} · {t.patch.zoneMode==='lanes'?'half spaces':'thirds'}</p></div><Btn onClick={()=>applyTemplate(t)}>Load</Btn></div>)}</div></Panel><Panel title="My templates" subtitle="Reusable club language"><div className="mb-4 flex gap-2"><Btn onClick={saveTemplate} className="bg-emerald-600 text-white hover:bg-emerald-500">Save current as template</Btn><Btn onClick={reset}>Reset session</Btn></div>{templates.length===0?<p className="text-sm italic text-slate-500">No saved templates yet.</p>:<div className="space-y-2">{templates.map((t,i)=><div key={i} className="flex items-center justify-between rounded-lg border p-3"><span className="text-sm font-bold">{t.name}</span><Btn onClick={()=>applyTemplate(t)}>Load</Btn></div>)}</div>}</Panel></div>}
<footer className="mt-6 flex flex-wrap justify-between gap-3 text-[10px] font-bold uppercase tracking-[.18em] text-slate-500 print:hidden"><span>Local autosave enabled</span><span>Print / PDF uses your browser print dialog</span></footer></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
