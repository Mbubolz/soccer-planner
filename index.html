<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach Board | Session Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print {
      body { background:#fff !important; color:#0f172a !important; }
      .print\:hidden,.no-print { display:none !important; }
      .print\:shadow-none { box-shadow:none !important; }
      .print\:border-none { border:none !important; }
      .print-board { display:block !important; }
    }
    * { box-sizing:border-box; }
    body { margin:0; }
    .coach-dark {
      background: linear-gradient(135deg, #0b1220 0%, #111827 100%);
      color:#f8fafc;
    }
    .coach-dark .panel {
      background:#111827; border-color:#1f2937 !important; color:#f8fafc;
    }
    .coach-dark .muted { color:#94a3b8; }
    .coach-dark input, .coach-dark textarea, .coach-dark select {
      background:#0f172a; color:#f8fafc; border-color:#334155;
    }
    .pitch-grid {
      background: radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(0,0,0,0.06));
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;
    const STORAGE = 'pro_coach_board_v23';
    const clone = (value) => JSON.parse(JSON.stringify(value));

    const ZONES = {

        { id: 'att', label: 'Attacking third', short: 'ATTACKING', x: 66.667, w: 33.333, color: '#dc2626' }

        { id: 'lw', label: 'Left wide', short: 'LEFT WIDE', x: 0, w: 16.667, color: '#0ea5e9' },
        { id: 'lh', label: 'Left half-space', short: 'LEFT HALF', x: 16.667, w: 16.667, color: '#8b5cf6' },
        { id: 'c', label: 'Central lane', short: 'CENTRAL', x: 33.333, w: 33.334, color: '#16a34a' },
        { id: 'rh', label: 'Right half-space', short: 'RIGHT HALF', x: 66.667, w: 16.667, color: '#8b5cf6' },
        { id: 'rw', label: 'Right wide', short: 'RIGHT WIDE', x: 83.333, w: 16.667, color: '#0ea5e9' }

    const FORMATIONS = {
      '4-3-3': [['GK',8,50],['RB',24,18],['RCB',20,38],['LCB',20,62],['LB',24,82],['6',43,50],['8',48,27],['10',48,73],['RW',70,18],['9',78,50],['LW',70,82]],
      '4-2-3-1': [['GK',8,50],['RB',24,18],['RCB',20,38],['LCB',20,62],['LB',24,82],['6',40,38],['8',40,62],['RW',61,18],['10',57,50],['LW',61,82],['9',79,50]],
      '3-4-3': [['GK',8,50],['RCB',20,30],['CB',20,50],['LCB',20,70],['RWB',43,12],['6',42,39],['8',42,61],['LWB',43,88],['RW',68,20],['9',80,50],['LW',68,80]]
    };

    const TEMPLATE_LIBRARY = [
      {
        name: 'Match Day 4-3-3',
        patch: {
          title: 'Match Day Plan',
          formation: '4-3-3',
          zoneMode: 'lanes',
          focus: 'Control the central lane, attack the half-spaces, and press immediately after loss.',
          objectives: 'In possession: find the free 8/10 in the half-space.\nOut of possession: trigger once the ball is on the far side and protect the inside lane.',
          matchPlan: 'First 15 min: establish rhythm and test the weak-side fullback.\nIf leading: protect the central lane and attack with width.\nIf chasing: add a second runner and attack the back post.'
        }
      },
      {
        name: 'Build-through-half-spaces',
        patch: {
          title: 'Build Through Half-Spaces',
          formation: '4-2-3-1',
          zoneMode: 'lanes',
          focus: 'Attract pressure, turn, and attack the space behind the lines.',
          objectives: 'Use the 6 and 8 to create a free player.\nProgress into the half-space before the third-man pass.',
          matchPlan: 'Keep width high. The winger should remain wide until the half-space runner is checked.'
        }
      },
      {
        name: 'High press triggers',
        patch: {
          title: 'High Pressing Principles',
          formation: '4-3-3',
          zoneMode: 'thirds',
          focus: 'Trigger press on backward or central passes and force the ball wide.',
          objectives: 'Press with the front line when the ball is on the far side.\nRecover compactly with the 6 and 8 behind.',
          matchPlan: 'Use the front line to block the reversal. If the ball is turned, recover in a flat block.'
        }
      }
    ];

    const DEFAULT_SESSION = {
      title: 'Match Day / Training Session',
      club: 'ACADEMY & CLUB DEVELOPMENT SUITE',
      team: '',
      date: '',
      opponent: '',
      venue: '',
      kickoff: '',
      formation: '4-3-3',
      zoneMode: 'lanes',
      darkMode: true,
      focus: 'Build through the half-spaces and press immediately after losing possession.',
      objectives: 'Create a free player between lines.\nProtect the central lane and attack the back side of the ball.',
      matchPlan: 'Start with tempo and positive width. Attack the far side with the 8/10 and split the back line with the 9. If the opponent blocks the central lane, switch play early.',
      coachNotes: 'Key message: body shape before the ball, then exploit the half-space with overloads.\nSupport this with quick scanning and clean first actions.',
      tags: ['Half-space access', 'Press triggers', 'Wide support', 'Second phase'],
      checks: { build: false, press: true, rest: false, transitions: true, standards: false },
      activities: [
        { title: 'Activation & Rondo', duration: '15 min', objective: 'Receive side-on and scan before the pass.', detail: 'One-touch patterns. Emphasise first touch and body shape.' },
        { title: 'Build-up & Positional Play', duration: '25 min', objective: 'Find the free player in the half-space.', detail: 'Pattern from the back line to the 8 and 10. Encourage play through the middle lane.' },
        { title: 'Pressing & Transition', duration: '25 min', objective: 'Win the ball in the first 6 seconds.', detail: 'Disrupt the central lane and force play wide before pressing.' },
        { title: 'Conditioned Match', duration: '25 min', objective: 'Transfer principles into competitive moments.', detail: 'Progress with a target goal and a small-sided game condition.' }
      ],
      startingXI: [
        { id: 1, name: '1', role: 'GK', note: 'Start high with the ball' },
        { id: 2, name: '2', role: 'RB', note: 'Wide support' },
        { id: 4, name: '4', role: 'CB', note: 'Team line' },
        { id: 5, name: '5', role: 'CB', note: 'Build through the half-space' },
        { id: 3, name: '3', role: 'LB', note: 'Overlap with the winger' },
        { id: 6, name: '6', role: 'CDM', note: 'Screen central lane' },
        { id: 8, name: '8', role: 'CM', note: 'Progress under pressure' },
        { id: 10, name: '10', role: 'AM', note: 'Half-space access' },
        { id: 7, name: '7', role: 'RW', note: 'Stay wide' },
        { id: 9, name: '9', role: 'ST', note: 'Pin the back line' },
        { id: 11, name: '11', role: 'LW', note: 'Target the far-side channel' }
      ],
      bench: [
        { id: 12, name: '12', role: 'GK' },
        { id: 13, name: '13', role: 'CB' },
        { id: 14, name: '14', role: 'CM' },
        { id: 15, name: '15', role: 'RW' },
        { id: 16, name: '16', role: 'ST' },
        { id: 17, name: '17', role: 'AM' }
      ],
      substitutions: [
        { minute: '60', playerIn: '14', playerOut: '7', reason: 'Fresh width' },
        { minute: '70', playerIn: '15', playerOut: '6', reason: 'Counter-press energy' },
        { minute: '78', playerIn: '16', playerOut: '9', reason: 'Direct threat' }
      ],
      opposition: {
        style: 'High-mid block with aggressive press in the half-space.',
        pressing: 'Front line presses from the front and the 6 screens the central lane.',
        weaknesses: 'Left-side second balls and fullback isolation behind the 10.',
        setPieces: 'Target the front post on corners; second balls from near post on free kicks.'
      },
      setPieces: {
        corners: 'Short corner to the near side, attack the front post with the 9 and 11.',
        freekicks: 'Four-man wall, 10 drives through the gap, 9 attacks the front post.',
        throws: 'Use the 6 to receive and play into the half-space.'
      },
      marks: []
    };

    function loadStore() {
      try {
        const raw = localStorage.getItem(STORAGE);
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    }

    function Btn({ children, onClick, active = false, tone = 'slate', className = '' }) {
      const base = active ? `bg-${tone}-600 text-white` : 'bg-slate-100 text-slate-700 hover:bg-slate-200';
      return (
        <button type="button" onClick={onClick} className={`rounded-lg px-3 py-2 text-[11px] font-bold uppercase tracking-[0.14em] transition ${base} ${className}`}>
          {children}
        </button>
      );
    }

    function Panel({ title, subtitle, children, className = '', dark = false }) {
      return (
        <section className={`${dark ? 'coach-dark panel' : 'bg-white'} rounded-2xl border-2 border-slate-900 p-5 shadow-xl sm:p-6 ${className}`}>
          <h2 className="mb-1 text-xl font-black uppercase tracking-tight">{title}</h2>
          {subtitle && <p className="mb-4 text-[10px] font-black uppercase tracking-[0.22em] text-slate-500 muted">{subtitle}</p>}
          {children}
        </section>
      );
    }

    function TeamList({ players, title, small = false }) {
      return (
        <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
          <div className="mb-2 text-[10px] font-black uppercase tracking-[0.22em] text-slate-500">{title}</div>
          <div className="space-y-2">
            {players.map((player) => (
              <div key={player.id} className="flex items-center justify-between rounded-lg bg-white px-2 py-2 shadow-sm">
                <div className="flex items-center gap-2">
                  <div className="flex h-7 w-7 items-center justify-center rounded-full bg-slate-900 text-[10px] font-black text-white">{player.name}</div>
                  <div>
                    <div className="text-xs font-bold">{player.role}</div>
                    {player.note && <div className="text-[10px] text-slate-500">{player.note}</div>}
                  </div>
                </div>
                {player.role && player.note && <div className="text-[10px] uppercase text-slate-400">{small ? 'Read' : 'Focus'}</div>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Board({ session, setSession }) {
      const ref = useRef(null);
      const [tool, setTool] = useState('select');
      const [color, setColor] = useState('#facc15');
      const [drawing, setDrawing] = useState(null);
      const [selected, setSelected] = useState(-1);
      const zones = ZONES[session.zoneMode === 'thirds' ? 'thirds' : 'lanes'];

      const getPoint = (event) => {
        const rect = ref.current.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * 560 / rect.width,
          y: (event.clientY - rect.top) * 320 / rect.height
        };
      };

      const nearest = (point) => {
        let best = -1;
        let min = 24;
        (session.marks || []).forEach((obj, index) => {
          const cx = obj.x ?? obj.sx ?? 0;
          const cy = obj.y ?? obj.sy ?? 0;
          const d = Math.hypot(cx - point.x, cy - point.y);
          if (d < min) {
            min = d;
            best = index;
          }
        });
        return best;
      };

      const addMark = (obj) => setSession((s) => ({ ...s, marks: [...(s.marks || []), obj] }));

      const onPointerDown = (event) => {
        const point = getPoint(event);

        if (tool === 'erase') {
          const idx = nearest(point);
          if (idx >= 0) {
            setSession((s) => ({ ...s, marks: s.marks.filter((_, i) => i !== idx) }));
          }
          return;
        }

        if (tool === 'select') {
          setSelected(nearest(point));
          return;
        }

        if (tool === 'player') {
          const label = window.prompt('Player number or label', '7') || '7';
          addMark({ type: 'player', x: point.x, y: point.y, label, color });
          return;
        }

        if (tool === 'ball' || tool === 'cone' || tool === 'marker') {
          addMark({ type: tool, x: point.x, y: point.y, color });
          return;
        }

        if (tool === 'freehand') {
          setDrawing({ type: 'freehand', points: [point], color });
          return;
        }

        if (['pass', 'run', 'line'].includes(tool)) {
          setDrawing({ type: tool, sx: point.x, sy: point.y, ex: point.x, ey: point.y, color });
        }
      };

      const onPointerMove = (event) => {
        if (!drawing) return;
        const point = getPoint(event);
        setDrawing((prev) => {
          if (!prev) return prev;
          if (prev.type === 'freehand') {
            return { ...prev, points: [...prev.points, point] };
          }
          return { ...prev, ex: point.x, ey: point.y };
        });
      };

      const onPointerUp = () => {
        if (drawing) {
          addMark(drawing);
          setDrawing(null);
        }
      };

      useEffect(() => {
        const canvas = ref.current;
        if (!canvas) return;

        canvas.addEventListener('pointerdown', onPointerDown);
        canvas.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        return () => {
          canvas.removeEventListener('pointerdown', onPointerDown);
          canvas.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
        };
      }, [tool, drawing, session.marks, color]);

      useEffect(() => {
        const canvas = ref.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 560, 320);
        ctx.fillStyle = '#166534';
        ctx.fillRect(0, 0, 560, 320);

        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 2;
        ctx.strokeRect(8, 8, 544, 304);
        ctx.beginPath();
        ctx.moveTo(280, 8);
        ctx.lineTo(280, 312);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(280, 160, 45, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeRect(8, 105, 72, 110);
        ctx.strokeRect(480, 105, 72, 110);
        ctx.strokeRect(8, 135, 25, 50);
        ctx.strokeRect(527, 135, 25, 50);

        const all = [...(session.marks || []), ...(drawing ? [drawing] : [])];
        all.forEach((obj, idx) => {
          ctx.save();
          ctx.strokeStyle = idx === selected ? '#fef3c7' : obj.color || '#ffffff';
          ctx.fillStyle = obj.color || '#ffffff';
          ctx.lineWidth = idx === selected ? 4 : 3;
          ctx.lineCap = 'round';

          if (['pass', 'run', 'line'].includes(obj.type)) {
            ctx.setLineDash(obj.type === 'pass' ? [8, 6] : obj.type === 'run' ? [4, 5] : []);
            ctx.beginPath();
            ctx.moveTo(obj.sx, obj.sy);
            ctx.lineTo(obj.ex, obj.ey);
            ctx.stroke();
            ctx.setLineDash([]);
            const angle = Math.atan2(obj.ey - obj.sy, obj.ex - obj.sx);
            ctx.beginPath();
            ctx.moveTo(obj.ex, obj.ey);
            ctx.lineTo(obj.ex - 10 * Math.cos(angle - 0.5), obj.ey - 10 * Math.sin(angle - 0.5));
            ctx.lineTo(obj.ex - 10 * Math.cos(angle + 0.5), obj.ey - 10 * Math.sin(angle + 0.5));
            ctx.closePath();
            ctx.fill();
          } else if (obj.type === 'freehand') {
            ctx.beginPath();
            obj.points.forEach((q, i) => i === 0 ? ctx.moveTo(q.x, q.y) : ctx.lineTo(q.x, q.y));
            ctx.stroke();
          } else if (obj.type === 'player') {
            ctx.beginPath();
            ctx.arc(obj.x, obj.y, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#111827';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(obj.label || '', obj.x, obj.y + 4);
          } else if (obj.type === 'cone') {
            ctx.beginPath();
            ctx.moveTo(obj.x, obj.y - 9);
            ctx.lineTo(obj.x - 8, obj.y + 9);
            ctx.lineTo(obj.x + 8, obj.y + 9);
            ctx.closePath();
            ctx.fill();
          } else if (obj.type === 'ball') {
            ctx.beginPath();
            ctx.arc(obj.x, obj.y, 6, 0, Math.PI * 2);
            ctx.fill();
          } else if (obj.type === 'marker') {
            ctx.beginPath();
            ctx.arc(obj.x, obj.y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#111827';
            ctx.fillRect(obj.x - 1, obj.y - 12, 2, 18);
          }
          ctx.restore();
        });
      }, [session.marks, drawing, selected, session.zoneMode, color]);

      const tools = ['select', 'player', 'ball', 'cone', 'marker', 'pass', 'run', 'line', 'freehand', 'erase'];

      return (
        <div className="rounded-2xl bg-slate-900 p-3 text-white shadow-xl">
          <div className="mb-3 flex flex-wrap gap-2 print:hidden">
            <select value={session.zoneMode} onChange={(e) => setSession((s) => ({ ...s, zoneMode: e.target.value }))} className="rounded bg-slate-700 px-2 py-2 text-xs font-bold text-white">
              <option value="lanes">Half-space lanes</option>
              <option value="thirds">Traditional thirds</option>
            </select>

            {tools.map((toolName) => (
              <button
                key={toolName}
                type="button"
                onClick={() => setTool(toolName)}
                className={`rounded px-2.5 py-2 text-[11px] font-bold ${tool === toolName ? 'bg-yellow-400 text-slate-900' : 'bg-slate-700 hover:bg-slate-600'}`}
              >
                {toolName === 'select' ? 'Select' :
                 toolName === 'player' ? 'Player' :
                 toolName === 'ball' ? 'Ball' :
                 toolName === 'cone' ? 'Cone' :
                 toolName === 'marker' ? 'Marker' :
                 toolName === 'pass' ? 'Pass' :
                 toolName === 'run' ? 'Run' :
                 toolName === 'line' ? 'Line' :
                 toolName === 'freehand' ? 'Hand scan' : 'Erase'}
              </button>
            ))}

            <input type="color" value={color} onChange={(e) => setColor(e.target.value)} className="h-9 w-9 rounded border border-white/20" aria-label="marker-color" />
            <button type="button" onClick={() => setSession((s) => ({ ...s, marks: [] }))} className="rounded bg-red-700 px-2.5 py-2 text-[11px] font-bold hover:bg-red-600">Clear</button>
          </div>

          <div className="pitch-grid relative overflow-hidden rounded-xl bg-green-800">
            <div className="pointer-events-none absolute inset-0">
              {zones.map((zone) => (
                <div key={zone.id} style={{ position: 'absolute', left: `${zone.x}%`, width: `${zone.w}%`, top: 0, height: '100%', background: zone.color, opacity: 0.14, borderRight: '1px solid rgba(255,255,255,0.45)' }}>
                  <div className="flex h-full items-center justify-center text-[8px] font-black tracking-[0.18em] text-white/70">
                    {zone.short}
                  </div>
                </div>
              ))}
            </div>
            <canvas ref={ref} width={560} height={320} className="relative block h-auto w-full touch-none cursor-crosshair" />
          </div>

          <div className="mt-2 flex items-center justify-between text-[11px] text-slate-300">
            <span>{tool === 'freehand' ? 'Draw your tactical scan directly on the pitch.' : 'Use a tool to add players, actions, and match-day cues.'}</span>
            <span>{(session.marks || []).length} marks</span>
          </div>
        </div>
      );
    }

    function FormationBoard({ session, setSession }) {
      const positions = FORMATIONS[session.formation] || FORMATIONS['4-3-3'];
      return (
        <div className="rounded-2xl border-2 border-white/60 bg-green-800 p-2 shadow-inner">
          <div className="relative aspect-[1.6] overflow-hidden rounded-xl border-2 border-white/50">
            <div className="absolute inset-x-0 top-1/2 h-0 border-t-2 border-white/70" />
            <div className="absolute inset-y-0 left-1/2 w-0 border-l-2 border-white/70" />
            <div className="absolute left-1/2 top-1/2 h-[24%] w-[12%] -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white/70" />
            <div className="absolute left-0 top-[25%] h-[50%] w-[12%] rounded-r-2xl border-2 border-white/70" />
            <div className="absolute right-0 top-[25%] h-[50%] w-[12%] rounded-l-2xl border-2 border-white/70" />
            {positions.map(([label, x, y]) => (
              <div key={`${label}-${x}-${y}`} className="absolute -translate-x-1/2 -translate-y-1/2" style={{ left: `${x}%`, top: `${y}%` }}>
                <div className="flex h-7 w-7 items-center justify-center rounded-full border-2 border-white bg-red-600 text-[9px] font-black text-white shadow-md">{label}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const saved = loadStore();
      const [session, setSession] = useState(saved.session || DEFAULT_SESSION);
      const [templates, setTemplates] = useState(saved.templates || []);
      const [view, setView] = useState('board');
      const [toast, setToast] = useState('');

      useEffect(() => {
        localStorage.setItem(STORAGE, JSON.stringify({ session, templates }));
      }, [session, templates]);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(''), 1800);
        return () => clearTimeout(t);
      }, [toast]);

      const updateSession = (key, value) => setSession((s) => ({ ...s, [key]: value }));
      const updateActivity = (index, field, value) => {
        setSession((s) => ({
          ...s,
          activities: s.activities.map((activity, i) => i === index ? { ...activity, [field]: value } : activity)
        }));
      };

      const applyTemplate = (template) => {
        setSession((s) => ({ ...s, ...clone(template.patch), marks: [] }));
        setToast(`${template.name} loaded`);
      };

      const saveTemplate = () => {
        const name = window.prompt('Template name', 'My template');
        if (!name) return;
        setTemplates((prev) => [...prev, { name, patch: clone(session) }]);
        setToast('Template saved');
      };

      const resetSession = () => {
        if (window.confirm('Reset the current session?')) {
          setSession(clone(DEFAULT_SESSION));
          setToast('Session reset');
        }
      };

      const darkClass = session.darkMode ? 'coach-dark' : 'bg-slate-100';

      return (
        <main className={`${darkClass} min-h-screen p-4 sm:p-6`}>
          <header className="mb-6 flex flex-wrap items-center justify-between gap-4 rounded-2xl border-2 border-slate-900 bg-white p-5 shadow-xl">
            <div>
              <h1 className="text-2xl font-black uppercase tracking-tight sm:text-3xl">{session.club || 'Coach Board'}</h1>
              <p className="text-[10px] font-black uppercase tracking-[0.28em] text-slate-500">Session planner · Match day coach board</p>
            </div>

            <nav className="flex flex-wrap gap-2 print:hidden">
              {['board', 'session', 'match', 'templates'].map((tab) => (
                <Btn key={tab} onClick={() => setView(tab)} active={view === tab}>
                  {tab === 'board' ? 'Coach board' : tab === 'session' ? 'Session plan' : tab === 'match' ? 'Match day' : 'Templates'}
                </Btn>
              ))}
              <Btn onClick={() => window.print()} className="bg-blue-600 text-white hover:bg-blue-500">Print</Btn>
            </nav>
          </header>

          {toast && (
            <div className="fixed right-4 top-4 z-50 rounded-lg bg-emerald-600 px-4 py-3 text-sm font-bold text-white shadow-xl">
              {toast}
            </div>
          )}

          {view === 'board' && (
            <div className="grid gap-6 xl:grid-cols-[1.3fr_340px]">
              <Panel title="Tactical board" subtitle="Live match-day planning" dark={session.darkMode} className="panel">
                <Board session={session} setSession={setSession} />

                <div className="mt-4 grid gap-3 sm:grid-cols-3">
                  <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                    <div className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">Theme</div>
                    <div className="mt-2 text-sm font-bold">{session.focus}</div>
                  </div>
                  <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                    <div className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">Formation</div>
                    <div className="mt-2 text-sm font-bold">{session.formation}</div>
                  </div>
                  <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                    <div className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">Opponent</div>
                    <div className="mt-2 text-sm font-bold">{session.opponent || 'Not set'}</div>
                  </div>
                </div>
              </Panel>

              <div className="space-y-6">
                <Panel title="Match checklist" subtitle="Before • during • after" dark={session.darkMode}>
                  <div className="space-y-2 text-xs font-bold">
                    {Object.entries({ build: 'Build-up / possession', press: 'Pressing triggers', rest: 'Rest defence', transitions: 'Transitions', standards: 'Set pieces / restarts' }).map(([key, label]) => (
                      <label key={key} className="flex cursor-pointer items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 p-2">
                        <input type="checkbox" checked={!!session.checks[key]} onChange={(e) => setSession((s) => ({ ...s, checks: { ...s.checks, [key]: e.target.checked } }))} className="h-4 w-4 accent-emerald-600" />
                        <span>{label}</span>
                      </label>
                    ))}
                  </div>
                </Panel>

                <Panel title="Coach cues" subtitle="Quick references" dark={session.darkMode}>
                  <ul className="space-y-2 text-sm text-slate-700">
                    <li>• Scan before receiving.</li>
                    <li>• Attack the free player in the half-space.</li>
                    <li>• Protect the central lane after turnover.</li>
                    <li>• Counter-press immediately when the ball is lost.</li>
                    <li>• Using width to reset and attack behind.</li>
                  </ul>
                </Panel>
              </div>
            </div>
          )}

          {view === 'session' && (
            <div className="space-y-6">
              <Panel title="Session detail" subtitle="Planning and objective setting" dark={session.darkMode}>
                <div className="grid gap-3 sm:grid-cols-4">
                  <input value={session.title} onChange={(e) => updateSession('title', e.target.value)} className="rounded-lg border p-2 text-sm font-bold sm:col-span-2" placeholder="Session title" />
                  <input value={session.team} onChange={(e) => updateSession('team', e.target.value)} className="rounded-lg border p-2 text-sm" placeholder="Team" />
                  <input type="date" value={session.date} onChange={(e) => updateSession('date', e.target.value)} className="rounded-lg border p-2 text-sm" />
                </div>

                <div className="mt-4 grid gap-4 lg:grid-cols-2">
                  <label className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                    Tactical focus
                    <textarea value={session.focus} onChange={(e) => updateSession('focus', e.target.value)} className="mt-2 min-h-[120px] w-full rounded-lg border p-2 text-sm" />
                  </label>
                  <label className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                    Objective template
                    <textarea value={session.objectives} onChange={(e) => updateSession('objectives', e.target.value)} className="mt-2 min-h-[120px] w-full rounded-lg border p-2 text-sm" />
                  </label>
                </div>
              </Panel>

              <Panel title="Training blocks" subtitle="Activity detail" dark={session.darkMode}>
                <div className="grid gap-4 lg:grid-cols-2">
                  {session.activities.map((activity, index) => (
                    <div key={index} className="rounded-xl border border-slate-200 bg-slate-50 p-4">
                      <div className="grid gap-2 sm:grid-cols-[1fr_100px]">
                        <input value={activity.title} onChange={(e) => updateActivity(index, 'title', e.target.value)} className="rounded border p-2 text-sm font-black" />
                        <input value={activity.duration} onChange={(e) => updateActivity(index, 'duration', e.target.value)} className="rounded border p-2 text-sm" />
                      </div>
                      <input value={activity.objective} onChange={(e) => updateActivity(index, 'objective', e.target.value)} className="mt-2 w-full rounded border p-2 text-sm" placeholder="Session objective" />
                      <textarea value={activity.detail} onChange={(e) => updateActivity(index, 'detail', e.target.value)} className="mt-2 min-h-[120px] w-full rounded border p-2 text-sm" placeholder="Setup, conditions, cues, progression..." />
                    </div>
                  ))}
                </div>

                <button type="button" onClick={() => setSession((s) => ({ ...s, activities: [...s.activities, { title: `Activity ${s.activities.length + 1}`, duration: '', objective: '', detail: '' }] }))} className="mt-5 rounded-lg bg-slate-900 px-4 py-2 text-sm font-bold text-white">Add activity</button>
              </Panel>
            </div>
          )}

          {view === 'match' && (
            <div className="grid gap-6 xl:grid-cols-[1.2fr_360px]">
              <Panel title="Match day board" subtitle="Team structure and scenario planning" dark={session.darkMode}>
                <div className="mb-4 grid gap-3 sm:grid-cols-3">
                  <input value={session.opponent} onChange={(e) => updateSession('opponent', e.target.value)} className="rounded border p-2 text-sm" placeholder="Opponent" />
                  <input value={session.venue} onChange={(e) => updateSession('venue', e.target.value)} className="rounded border p-2 text-sm" placeholder="Venue" />
                  <input value={session.kickoff} onChange={(e) => updateSession('kickoff', e.target.value)} className="rounded border p-2 text-sm" placeholder="Kick-off" />
                </div>

                <div className="mb-4 flex items-center gap-3">
                  <label className="text-[11px] font-black uppercase tracking-[0.18em] text-slate-500">
                    Formation
                    <select value={session.formation} onChange={(e) => updateSession('formation', e.target.value)} className="ml-2 rounded border p-2 text-sm">
                      {Object.keys(FORMATIONS).map((formation) => (
                        <option key={formation} value={formation}>{formation}</option>
                      ))}
                    </select>
                  </label>
                  <button type="button" onClick={() => setSession((s) => ({ ...s, darkMode: !s.darkMode }))} className="rounded-lg bg-slate-900 px-3 py-2 text-[11px] font-bold uppercase text-white">{session.darkMode ? 'Light' : 'Dark'} mode</button>
                </div>

                <FormationBoard session={session} setSession={setSession} />
              </Panel>

              <div className="space-y-6">
                <Panel title="Match plan" subtitle="Quick scenario notes" dark={session.darkMode}>
                  <textarea value={session.matchPlan} onChange={(e) => updateSession('matchPlan', e.target.value)} className="min-h-[180px] w-full rounded-lg border p-3 text-sm" placeholder="What will happen in the first 15, if leading, if chasing, key substitutions..." />
                </Panel>

                <Panel title="Opposition brief" subtitle="Scouting notes" dark={session.darkMode}>
                  <div className="space-y-2">
                    <textarea value={session.opposition.style} onChange={(e) => setSession((s) => ({ ...s, opposition: { ...s.opposition, style: e.target.value } }))} className="min-h-[60px] w-full rounded border p-2 text-sm" placeholder="Style of play" />
                    <textarea value={session.opposition.pressing} onChange={(e) => setSession((s) => ({ ...s, opposition: { ...s.opposition, pressing: e.target.value } }))} className="min-h-[60px] w-full rounded border p-2 text-sm" placeholder="Pressing trigger" />
                    <textarea value={session.opposition.weaknesses} onChange={(e) => setSession((s) => ({ ...s, opposition: { ...s.opposition, weaknesses: e.target.value } }))} className="min-h-[60px] w-full rounded border p-2 text-sm" placeholder="Weaknesses" />
                  </div>
                </Panel>
              </div>
            </div>
          )}

          {view === 'templates' && (
            <div className="grid gap-6 lg:grid-cols-2">
              <Panel title="Built-in templates" subtitle="Fast start" dark={session.darkMode}>
                <div className="space-y-3">
                  {TEMPLATE_LIBRARY.map((template) => (
                    <div key={template.name} className="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 p-3">
                      <div>
                        <div className="text-sm font-black">{template.name}</div>
                        <div className="text-[10px] uppercase tracking-[0.16em] text-slate-500">{template.patch.formation} · {template.patch.zoneMode === 'lanes' ? 'half spaces' : 'thirds'}</div>
                      </div>
                      <Btn onClick={() => applyTemplate(template)}>Load</Btn>
                    </div>
                  ))}
                </div>
              </Panel>

              <Panel title="Saved templates" subtitle="Reusable planning" dark={session.darkMode}>
                <div className="mb-4 flex flex-wrap gap-2">
                  <Btn onClick={saveTemplate} className="bg-emerald-600 text-white hover:bg-emerald-500">Save current</Btn>
                  <Btn onClick={resetSession}>Reset session</Btn>
                </div>

                {templates.length === 0 ? (
                  <p className="text-sm italic text-slate-500">No saved templates yet.</p>
                ) : (
                  <div className="space-y-2">
                    {templates.map((template, index) => (
                      <div key={index} className="flex items-center justify-between rounded-lg border border-slate-200 bg-slate-50 p-3">
                        <span className="text-sm font-bold">{template.name}</span>
                        <Btn onClick={() => applyTemplate(template)}>Load</Btn>
                      </div>
                    ))}
                  </div>
                )}
              </Panel>
            </div>
          )}

          <div className="mt-6 grid gap-6 xl:grid-cols-[1fr_1fr]">
            <Panel title="Starting XI" subtitle="Player tracking" dark={session.darkMode}>
              <div className="space-y-3">
                <TeamList players={session.startingXI} title="Starting XI" />
              </div>
            </Panel>

            <Panel title="Bench & substitutions" subtitle="Match management" dark={session.darkMode}>
              <div className="space-y-3">
                <TeamList players={session.bench} title="Bench" small={true} />
                <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                  <div className="mb-2 text-[10px] font-black uppercase tracking-[0.22em] text-slate-500">Substitutions</div>
                  <div className="space-y-2">
                    {session.substitutions.map((sub, index) => (
                      <div key={index} className="flex items-center justify-between rounded-lg bg-white px-2 py-2 text-xs font-bold">
                        <span>{sub.minute}'</span>
                        <span>{sub.playerIn} in for {sub.playerOut}</span>
                        <span className="text-slate-500">{sub.reason}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </Panel>
          </div>

          <div className="mt-6 grid gap-6 xl:grid-cols-[1fr_1fr]">
            <Panel title="Set-piece routines" subtitle="Corners & restarts" dark={session.darkMode}>
              <div className="space-y-3 text-sm">
                <textarea value={session.setPieces.corners} onChange={(e) => setSession((s) => ({ ...s, setPieces: { ...s.setPieces, corners: e.target.value } }))} className="min-h-[80px] w-full rounded border p-2" placeholder="Corner routine" />
                <textarea value={session.setPieces.freekicks} onChange={(e) => setSession((s) => ({ ...s, setPieces: { ...s.setPieces, freekicks: e.target.value } }))} className="min-h-[80px] w-full rounded border p-2" placeholder="Free-kick routine" />
                <textarea value={session.setPieces.throws} onChange={(e) => setSession((s) => ({ ...s, setPieces: { ...s.setPieces, throws: e.target.value } }))} className="min-h-[80px] w-full rounded border p-2" placeholder="Throw routine" />
              </div>
            </Panel>

            <Panel title="Match-day summary" subtitle="One-page ready" dark={session.darkMode}>
              <div className="space-y-3 text-sm">
                <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                  <div className="text-[10px] font-black uppercase tracking-[0.18em] text-slate-500">Club</div>
                  <div className="mt-1 font-bold">{session.club}</div>
                </div>
                <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                  <div className="text-[10px] font-black uppercase tracking-[0.18em] text-slate-500">Game model</div>
                  <div className="mt-1">{session.focus}</div>
                </div>
                <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                  <div className="text-[10px] font-black uppercase tracking-[0.18em] text-slate-500">Coach notes</div>
                  <div className="mt-1 whitespace-pre-line">{session.coachNotes || 'Add key coaching notes here.'}</div>
                </div>
                <textarea value={session.coachNotes} onChange={(e) => updateSession('coachNotes', e.target.value)} className="min-h-[100px] w-full rounded border p-2" placeholder="Final notes for the group" />
              </div>
            </Panel>
          </div>

          <footer className="mt-6 flex flex-wrap justify-between gap-3 text-[10px] font-bold uppercase tracking-[0.18em] text-slate-500 print:hidden">
            <span>Local autosave enabled</span>
            <span>Print / PDF from your browser</span>
          </footer>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
